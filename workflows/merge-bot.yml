name: Merge Bot

# Generic workflow — synced from automation-core. Closes the self-healing
# loop: squash-merges PRs that are fully green once codex-gate passes.
# Woken by: a successful Codex Gate or repository CI workflow_run, a once-daily
# safety-net cron, or manual dispatch. The CI wake closes the ordering case
# where the gate turns green before the final build check. check_suite is
# intentionally NOT a
# trigger: it fires on every CI suite (storms ~22x/5min on unrelated runs)
# yet does NOT fire for the gate's own Actions-created suite — so it added
# noise without covering the case that matters. A build-gate finishing after
# the gate is already green is still covered: that completion re-runs Codex
# Gate (or the gate is already success), and the cron is the backstop.
# The job early-exits unless the signal is a SUCCESSFUL Codex Gate run — so it
# never storms on red/in-flight. The merge uses AUTOMATION_PAT so the push to
# the base branch triggers downstream workflows (health-check, etc.).
# fail-soft: missing PAT → GREEN.

on:
  # check_suite does NOT fire for workflow runs created by GitHub Actions
  # (Codex Gate runs under GITHUB_TOKEN), so this workflow_run is what wakes
  # merge-bot when the gate turns green. Filtered to success in the job if:.
  workflow_run:
    workflows: ["Codex Gate", "CI", "Automation Core CI"]
    types: [completed]
  schedule:
    - cron: '30 7 * * *'   # safety-net once daily (07:30 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read
  statuses: read

concurrency:
  group: merge-bot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    # Early-exit: proceed ONLY on a signal that the mandatory gate just turned
    # GREEN — otherwise skip immediately (no scan). Waking conditions:
    #   (a) Codex Gate or repository CI workflow_run completed success,
    #   (b) the daily safety-net cron,
    #   (c) manual dispatch.
    # workflow_run is filtered to success here. Every wake still revalidates
    # all latest checks and the authoritative exact-head gate before merging.
    if: |
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Fail-soft check for AUTOMATION_PAT
        id: patcheck
        env:
          AUTOMATION_PAT: ${{ secrets.AUTOMATION_PAT }}
        run: |
          if [ -z "${AUTOMATION_PAT}" ]; then
            echo "::notice::AUTOMATION_PAT is not set — skipping Merge Bot (fail-soft)."
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate and merge eligible PRs
        if: steps.patcheck.outputs.has_pat == 'true'
        uses: actions/github-script@v8
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Requirement 1: Claude fallback review evidence is honoured only
          # where repository policy explicitly opts in. Must match codex-gate.yml.
          CLAUDE_FALLBACK_REVIEW_ENABLED: ${{ vars.CLAUDE_FALLBACK_REVIEW_ENABLED }}
          # fix #17 Part C: read-only client token for the checks/statuses reads.
          # Fine-grained PATs CANNOT be granted the Checks permission at all (no
          # such option exists in the PAT UI), so checks.listForRef on the PAT
          # crashes with "Resource not accessible by personal access token"
          # (INCIDENT 2). GITHUB_TOKEN carries this workflow's declared
          # `checks: read` + `statuses: read`, so the reads run on it instead.
          GH_READONLY_TOKEN: ${{ github.token }}
          # Transient-provenance labels are deliberately assigned as
          # github-actions[bot], making their event provenance unambiguous.
          GH_LABEL_TOKEN: ${{ github.token }}
        with:
          # AUTOMATION_PAT stays the step token for merges, comments, branch
          # deletion, and other mutations that must trigger downstream work.
          # Only transient-provenance label assignment uses GH_LABEL_TOKEN.
          # pulls.merge must remain PAT-authored so the push to main triggers
          # downstream workflows.
          github-token: ${{ secrets.AUTOMATION_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // fix #17 Part C: reads go through GITHUB_TOKEN (fine-grained PATs
            // can't hold Checks perm); mutations stay on the PAT (`github`).
            // fix #19: NO module loading inside github-script — both the v7 and the v8
            // forms of loading the @actions/github module crash "Cannot find module"
            // (the action ships an ncc bundle with no node_modules to resolve). Do the
            // two GITHUB_TOKEN reads with the built-in global fetch (raw REST), zero
            // modules.
            const GH_RO = process.env.GH_READONLY_TOKEN;
            const GH_LABEL_TOKEN = process.env.GH_LABEL_TOKEN;
            async function actionLabelRequest(method, path, body) {
              const res = await fetch(`https://api.github.com${path}`, {
                method,
                headers: {
                  Authorization: `Bearer ${GH_LABEL_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                },
                body: body === undefined ? undefined : JSON.stringify(body),
              });
              if (!res.ok) {
                const error = new Error(`${method} ${path} -> ${res.status}: ${(await res.text()).slice(0, 200)}`);
                error.status = res.status;
                throw error;
              }
              return res.status === 204 ? null : res.json();
            }
            // fix #20: follow the Link rel="next" header until absent (50-page
            // safety ceiling) — true pagination, replacing the fixed 10-page valve.
            async function roPage(url) {
              const res = await fetch(url, { headers: { Authorization: `Bearer ${GH_RO}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } });
              if (!res.ok) throw new Error(`GET ${url} -> ${res.status}: ${(await res.text()).slice(0, 200)}`);
              const m = (res.headers.get('link') || '').match(/<([^>]+)>;\s*rel="next"/);
              return { data: await res.json(), next: m ? m[1] : null };
            }
            async function roPaged(path, extract) {
              const out = [];
              let url = `https://api.github.com${path}`;
              for (let i = 0; i < 50 && url; i++) {
                const { data, next } = await roPage(url);
                out.push(...extract(data));
                url = next;
              }
              return out;
            }
            const roCheckRuns = (ref) => roPaged(`/repos/${owner}/${repo}/commits/${encodeURIComponent(ref)}/check-runs?per_page=100`, (d) => d.check_runs || []);
            const roStatuses = (ref) => roPaged(`/repos/${owner}/${repo}/commits/${encodeURIComponent(ref)}/statuses?per_page=100`, (d) => d);
            const roWorkflowRuns = () => roPaged(`/repos/${owner}/${repo}/actions/runs?event=pull_request&per_page=100`, (d) => d.workflow_runs || []);
            let prWorkflowRunsPromise = null;
            const allPrWorkflowRuns = () => {
              if (!prWorkflowRunsPromise) prWorkflowRunsPromise = roWorkflowRuns();
              return prWorkflowRunsPromise;
            };
            const CODEX_CHECK = 'check-codex-status';
            // The evaluator job is intentionally diagnostic and commonly fails
            // before review. Its explicit exact-head check below is authoritative.
            const NON_BLOCKING_DIAGNOSTIC_CHECKS = new Set(['codex-gate-evaluator']);
            const LABEL_AUTOMERGE = 'automerge';
            const LABEL_ESCALATE = 'needs-owner';
            const LABEL_ESCALATE_AUTO = 'needs-owner-auto';
            const LABEL_NO_AUTOMERGE = 'no-automerge';
            const CLAUDE_GENERATED_LABEL = 'claude-generated';
            const CODEX_OVERRIDE_LABEL = 'codex-p1-acknowledged';
            const SYNC_TITLE_PREFIX = 'chore(automation): sync from automation-core';
            const SYNC_BRANCH = 'chore/sync-automation-core';   // branch the sync workflow opens
            const OWNER_LOGIN = 'funzi7';
            const TRUSTED_CODEX_LOGINS = new Set([
              'chatgpt-codex-connector',
              'chatgpt-codex-connector[bot]',
            ]);
            const P1_PATTERN = /(?:P1-orange|(?:^|\n)[\s>*\-_#`]*(?:\*\*\s*P1\s*\*\*|\[P1\]|P1:))/i;
            const P2_PATTERN = /(?:P2-yellow|(?:^|\n)[\s>*\-_#`]*(?:\*\*\s*P2\s*\*\*|\[P2\]|P2:))/i;

            const labelNames = (pr) => new Set(
              (pr.labels || []).map((label) => label.name || label),
            );
            const isSameRepo = (pr) => !!(
              pr.head && pr.head.repo &&
              pr.head.repo.full_name === `${owner}/${repo}`
            );
            const isOwnerSameRepo = (pr) =>
              isSameRepo(pr) && pr.user && pr.user.login === OWNER_LOGIN;

            const isClaudeAutomationPr = (pr) => isSameRepo(pr) && !!(
              isClaudeBot(pr.user && pr.user.login) ||
              (pr.head && pr.head.ref && pr.head.ref.startsWith('claude/')) ||
              labelNames(pr).has(CLAUDE_GENERATED_LABEL)
            );

            function isTrustedSync(pr) {
              if ((pr.title || '') !== SYNC_TITLE_PREFIX) return false;
              if (!isSameRepo(pr)) return false;
              return pr.user?.login === OWNER_LOGIN &&
                pr.head && pr.head.ref === SYNC_BRANCH;
            }

            async function hasClaudeAutomationProvenance(pr) {
              if (isClaudeAutomationPr(pr)) return true;
              try {
                const events = await github.paginate(
                  'GET /repos/{owner}/{repo}/issues/{issue_number}/events',
                  { owner, repo, issue_number: pr.number, per_page: 100 },
                );
                return events.some((event) =>
                  event.event === 'labeled' &&
                  event.label?.name === CLAUDE_GENERATED_LABEL &&
                  event.actor?.login === 'github-actions[bot]'
                );
              } catch (e) {
                core.warning(`#${pr.number}: Claude provenance lookup failed; protected path stays fail-closed: ${e.message}`);
                return true;
              }
            }

            async function mayAutoMergeProtectedPaths(pr) {
              if (await hasClaudeAutomationProvenance(pr)) return false;
              return isTrustedSync(pr) || isOwnerSameRepo(pr);
            }

            function isAutoMergeCandidate(pr) {
              if (!pr || pr.state !== 'open' || pr.draft) return false;
              const labels = labelNames(pr);
              if (labels.has(LABEL_NO_AUTOMERGE)) return false;
              const sameRepo = isSameRepo(pr);
              const byClaudeBot = sameRepo && isClaudeBot(pr.user && pr.user.login);
              const explicitlyLabeled = labels.has(LABEL_AUTOMERGE);
              const claudeBranch = sameRepo && !!(
                pr.head && pr.head.ref && pr.head.ref.startsWith('claude/')
              );
              const claudeGenerated = byClaudeBot || claudeBranch ||
                labels.has(CLAUDE_GENERATED_LABEL);
              // The trusted Claude workflow records provenance even when the
              // model step fails, but grants automerge only on successful
              // delivery. Owner-looking PAT authorship must not bypass that
              // success-only signal.
              if (claudeGenerated && !explicitlyLabeled) return false;
              return (
                isOwnerSameRepo(pr) || byClaudeBot || explicitlyLabeled ||
                isTrustedSync(pr) || claudeBranch
              );
            }

            function stripSummarySections(body) {
              return String(body || '')
                .replace(/(?:^|\n)#{2,3}\s+Summary[\s\S]*?(?=\n#{2,3}\s|\n---|$)/gi, '')
                .replace(/(?:^|\n)#{2,3}\s+Testing[\s\S]*?(?=\n#{2,3}\s|\n---|$)/gi, '');
            }

            function hasSeverity(body) {
              const semantic = stripSummarySections(body);
              return P1_PATTERN.test(semantic) || P2_PATTERN.test(semantic);
            }

            const REVIEWED_COMMIT_PATTERN = /(?:^|\n)\*\*Reviewed commit:\*\*\s*`([a-f0-9]{10,40})`(?:\s|$)/i;

            function isCodexCapacityNotice(body) {
              const text = String(body || '').trim();
              return /^You have reached your Codex usage limits for code reviews\./i.test(text) ||
                /^Codex (?:is|was) (?:currently )?(?:at capacity|unable to (?:complete|perform) (?:this )?code review)/i.test(text);
            }
            function isCodexTaskResult(body) {
              const text = String(body || '');
              return /(?:^|\n)#{2,3}\s+Summary(?:\s|$)/i.test(text) &&
                /\[View task(?:\s*(?:→|->))?\s*\]\(/i.test(text);
            }
            const HEAD_EPOCH_MARKER_PATTERN = /<!--\s*codex-head-epoch:v3\s+run=(\d+)\s+attempt=(\d+)\s+pr=(\d+)\s+head=([a-f0-9]{40})\s*-->/i;
            function signalTargetsHead(item, headSha, headObservedAt, dateField = 'created_at') {
              const exactHead = String(headSha || '').toLowerCase();
              if (!/^[a-f0-9]{40}$/.test(exactHead)) return false;
              if (isCodexTaskResult(item?.body)) return false;
              const originalCommit = String(item?.original_commit_id || '').toLowerCase();
              if (originalCommit) return originalCommit === exactHead;
              const commit = String(item?.commit_id || '').toLowerCase();
              if (commit) return commit === exactHead;
              const marker = String(item?.body || '').match(REVIEWED_COMMIT_PATTERN)?.[1]?.toLowerCase();
              if (marker) return exactHead.startsWith(marker);
              return false;
            }

            const epochRunCache = new Map();
            const MAX_EPOCH_MARKER_CANDIDATES = 16;
            async function trustedHeadMarkers(comments, prNumber) {
              const refsByRun = new Map();
              for (const comment of comments || []) {
                if ((comment.user?.login || '') !== 'github-actions[bot]') continue;
                const match = String(comment.body || '').match(HEAD_EPOCH_MARKER_PATTERN);
                if (!match || Number(match[3]) !== Number(prNumber)) continue;
                const ref = {
                  runId: Number(match[1]), attempt: Number(match[2]),
                  markerPr: Number(match[3]), markerHead: match[4].toLowerCase(),
                  commentAt: new Date(comment.created_at || 0).getTime(),
                  commentId: Number(comment.id || 0),
                };
                const previous = refsByRun.get(ref.runId);
                if (!previous || ref.commentAt > previous.commentAt ||
                    (ref.commentAt === previous.commentAt && ref.commentId > previous.commentId)) {
                  refsByRun.set(ref.runId, ref);
                }
              }
              // Run IDs are used only to bound the newest candidate suffix;
              // authenticated run.created_at remains authoritative for epochs.
              // Truncation is fail-closed: it can require a newer review, never
              // revive evidence from an older head epoch.
              const candidates = [...refsByRun.values()]
                .sort((a, b) => b.runId - a.runId)
                .slice(0, MAX_EPOCH_MARKER_CANDIDATES);
              if (refsByRun.size > candidates.length) {
                core.info(`#${prNumber}: bounded epoch verification to ${candidates.length} newest run candidates.`);
              }
              const markers = [];
              for (const { runId, attempt, markerHead, commentAt } of candidates) {
                const key = `${runId}/${attempt}`;
                if (!epochRunCache.has(key)) {
                  epochRunCache.set(key,
                    roPage(`https://api.github.com/repos/${owner}/${repo}/actions/runs/${runId}/attempts/${attempt}`).then(({ data }) => data));
                }
                try {
                  const run = await epochRunCache.get(key);
                  const belongsToPr = (run.pull_requests || [])
                    .some((pull) => Number(pull.number) === Number(prNumber));
                  const startedAt = new Date(run.run_started_at || run.created_at || 0).getTime();
                  const finishedAt = new Date(run.updated_at || 0).getTime();
                  const commentInsideRun = Number.isFinite(commentAt) &&
                    commentAt >= startedAt - 5000 && commentAt <= finishedAt + 5000;
                  if (
                    run.path !== '.github/workflows/codex-gate.yml' ||
                    run.event !== 'pull_request_target' ||
                    Number(run.run_attempt) !== attempt || !belongsToPr || !commentInsideRun
                  ) continue;
                  const observedAt = new Date(run.created_at || 0).getTime();
                  // pull_request_target run.head_sha is the base SHA. Trust
                  // the payload head stored inside the verified Gate attempt.
                  const head = markerHead;
                  if (/^[a-f0-9]{40}$/.test(head) && Number.isFinite(observedAt) && observedAt > 0) {
                    markers.push({ head, observedAt, id: Number(run.id || runId) });
                  }
                } catch (e) {
                  core.warning(`#${prNumber}: epoch run ${runId} verification failed: ${e.message}`);
                }
              }
              // A rerun of an old attempt creates a new comment, but does not
              // create a new head epoch. Establish order only after each marker
              // is authenticated, using the immutable run creation time.
              return markers.sort((a, b) =>
                b.observedAt - a.observedAt || b.id - a.id);
            }
            async function onlyObservedHead(prNumber, headSha, comments) {
              try {
                const exactHead = String(headSha || '').toLowerCase();
                const rawHeads = (comments || [])
                  .filter((comment) => (comment.user?.login || '') === 'github-actions[bot]')
                  .map((comment) => String(comment.body || '').match(HEAD_EPOCH_MARKER_PATTERN))
                  .filter((match) => match && Number(match[3]) === Number(prNumber))
                  .map((match) => String(match[4]).toLowerCase());
                if (!rawHeads.length || rawHeads.some((head) => head !== exactHead)) return false;
                const runs = await allPrWorkflowRuns();
                if ((runs || []).some((run) =>
                  (run.pull_requests || []).some((pull) => Number(pull.number) === Number(prNumber)) &&
                  String(run.head_sha || '').toLowerCase() !== exactHead
                )) return false;
                const verified = await trustedHeadMarkers(comments, prNumber);
                return verified.some((marker) => marker.head === exactHead);
              } catch (e) {
                core.warning(`PR #${prNumber}: reaction head-history lookup failed; reaction stays non-binding: ${e.message}`);
                return false;
              }
            }
            function reactionTargetsOnlyObservedHead(reaction, headObservedAt, isOnlyHead) {
              if (!isOnlyHead || reaction?.content !== '+1') return false;
              const reactionAt = new Date(reaction?.created_at || 0).getTime();
              const observedAt = new Date(headObservedAt || 0).getTime();
              return Number.isFinite(reactionAt) && Number.isFinite(observedAt) &&
                observedAt > 0 && reactionAt > observedAt;
            }

            function currentHeadEpochFromTimeline(timeline, headSha) {
              return currentHeadEpochEvidenceFromTimeline(timeline, headSha).epoch;
            }

            function currentHeadEpochEvidenceFromTimeline(timeline, headSha) {
              const exactHead = String(headSha || '').toLowerCase();
              if (!timeline.length || timeline[0].head !== exactHead) {
                return { epoch: null, hasBoundary: false };
              }
              const epoch = [];
              for (const item of timeline) {
                if (item.head !== exactHead) {
                  return {
                    epoch: epoch.length ? new Date(Math.min(...epoch)) : null,
                    hasBoundary: true,
                  };
                }
                epoch.push(item.observedAt);
              }
              return {
                epoch: epoch.length ? new Date(Math.min(...epoch)) : null,
                hasBoundary: false,
              };
            }

            async function observedHeadTransition(prNumber, headSha, comments = []) {
              const [markers, runs] = await Promise.all([
                trustedHeadMarkers(comments, prNumber),
                allPrWorkflowRuns(),
              ]);
              const markerEpoch = currentHeadEpochFromTimeline(markers, headSha);
              const timeline = runs
                .filter((run) =>
                  (run.pull_requests || []).some((candidate) => candidate.number === prNumber))
                .map((run) => ({
                  head: String(run.head_sha || '').toLowerCase(),
                  observedAt: new Date(run.created_at || 0).getTime(),
                }))
                .filter((run) => /^[a-f0-9]{40}$/.test(run.head) && Number.isFinite(run.observedAt) && run.observedAt > 0)
                .sort((a, b) =>
                  b.observedAt - a.observedAt);
              const runEvidence = currentHeadEpochEvidenceFromTimeline(timeline, headSha);
              const runEpoch = runEvidence.epoch;
              // Authenticated markers retain the complete contiguous epoch. The
              // bounded run list may advance it only when it proves an
              // intervening different head that a failed marker write missed.
              if (markerEpoch && runEpoch && runEvidence.hasBoundary) {
                return new Date(Math.max(markerEpoch.getTime(), runEpoch.getTime()));
              }
              return markerEpoch || runEpoch;
            }

            async function hasActiveTrustedFinding(prNumber) {
              let cursor = null;
              do {
                const data = await github.graphql(
                  `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $cursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            isResolved
                            isOutdated
                            comments(first: 100) {
                              nodes { body author { login } }
                            }
                          }
                        }
                      }
                    }
                  }`,
                  { owner, repo, number: prNumber, cursor },
                );
                const connection = data.repository.pullRequest.reviewThreads;
                for (const thread of connection.nodes || []) {
                  if (thread.isResolved || thread.isOutdated) continue;
                  if ((thread.comments?.nodes || []).some((comment) =>
                    TRUSTED_CODEX_LOGINS.has(comment.author?.login || '') &&
                    hasSeverity(comment.body)
                  )) return true;
                }
                cursor = connection.pageInfo.hasNextPage
                  ? connection.pageInfo.endCursor
                  : null;
              } while (cursor);
              return false;
            }

            // ===== CANONICAL EXACT-HEAD REVIEW EVIDENCE ======================
            // Shared VERBATIM by codex-gate.yml, merge-bot.yml and
            // claude-fallback-watchdog.yml, and mirrored by
            // tools/review_evidence.js. tests/test_review_evidence.js asserts
            // the three inline copies stay byte-identical, so Gate, Merge Bot
            // and the watchdog can never drift into three different rules.
            //
            //   valid exact-head review evidence ==
            //     normal Codex evidence
            //     OR approved Claude fallback evidence when Codex is provably
            //     unavailable
            //
            // Every rule fails closed:
            //  - an attestation is ONE atomic marker written by the trusted
            //    automation identity, minted by the canonical producer
            //    workflow, and re-authenticated here against that run through
            //    the Actions API; free-form prose is never authority;
            //  - it binds to the exact 40-character head, so any new commit
            //    invalidates it and a previous-head attestation is worthless;
            //  - the trusted Codex code-review quota notice must belong to the
            //    CURRENT head epoch and still sit inside the episode TTL;
            //  - a genuine Codex result on this head ends the episode, and
            //    normal Codex evidence remains the default authority;
            //  - an attestation that declares unresolved P1/P2 blocks rather
            //    than clears;
            //  - any lookup failure produces no evidence at all.
            //
            // This is NOT an acknowledgement mechanism: it never substitutes
            // for codex-p1-acknowledged, an owner override, or a reaction.
            const FALLBACK_PROVIDER = 'claude_code_fallback';
            const FALLBACK_REASON = 'codex_quota_unavailable';
            const FALLBACK_VERDICT = 'clean';
            const FALLBACK_ATTESTATION_WORKFLOW_PATH =
              '.github/workflows/claude-fallback-review.yml';
            const FALLBACK_ATTESTATION_AUTHOR = 'github-actions[bot]';
            const CLAUDE_FALLBACK_MARKER_PATTERN =
              /<!--\s*claude-fallback-review:v1\b([^>]*)-->/gi;
            // validation is `<status>/<reference>`, and only a PASSED status
            // can carry evidence — a failed or unknown validation must never
            // mint a clean attestation.
            const FALLBACK_VALIDATION_PATTERN = /^passed\/[A-Za-z0-9._:#=,;+()-]{1,180}$/;
            // Route B bound: a decline from an earlier head epoch authorizes a
            // fallback only this long, so stale evidence cannot authorize a
            // later unrelated fallback forever.
            const QUOTA_EPISODE_TTL_MS = 24 * 60 * 60 * 1000;
            const MAX_FALLBACK_ATTESTATION_CANDIDATES = 8;

            // Self-contained trusted-Codex predicates. They deliberately do
            // not reuse each workflow's ambient copies: the inputs to the
            // canonical decision must be built identically in all three, or
            // byte-identical logic can still reach different verdicts.
            const EVIDENCE_CODEX_LOGINS = new Set([
              'chatgpt-codex-connector',
              'chatgpt-codex-connector[bot]',
            ]);
            const EVIDENCE_P1 = /(?:P1-orange|(?:^|\n)[\s>*\-_#`]*(?:\*\*\s*P1\s*\*\*|\[P1\]|P1:))/i;
            const EVIDENCE_P2 = /(?:P2-yellow|(?:^|\n)[\s>*\-_#`]*(?:\*\*\s*P2\s*\*\*|\[P2\]|P2:))/i;
            const evidenceIsCodex = (item) => EVIDENCE_CODEX_LOGINS.has(
              String(item?.user?.login || item?.author?.login || ''),
            );
            function evidenceIsCapacityNotice(body) {
              const text = String(body || '').trim();
              return /^You have reached your Codex usage limits for code reviews\./i.test(text) ||
                /^Codex (?:is|was) (?:currently )?(?:at capacity|unable to (?:complete|perform) (?:this )?code review)/i.test(text);
            }
            function evidenceIsTaskResult(body) {
              const text = String(body || '');
              return /(?:^|\n)#{2,3}\s+Summary(?:\s|$)/i.test(text) &&
                /\[View task(?:\s*(?:→|->))?\s*\]\(/i.test(text);
            }
            function evidenceHasSeverity(body) {
              const semantic = String(body || '')
                .replace(/(?:^|\n)#{2,3}\s+Summary[\s\S]*?(?=\n#{2,3}\s|\n---|$)/gi, '')
                .replace(/(?:^|\n)#{2,3}\s+Testing[\s\S]*?(?=\n#{2,3}\s|\n---|$)/gi, '');
              return EVIDENCE_P1.test(semantic) || EVIDENCE_P2.test(semantic);
            }

            // Build the canonical inputs from the raw Codex surfaces. Every
            // consumer MUST use this, so Gate, Merge Bot and the watchdog see
            // the same quota episode from the same evidence.
            function collectReviewEvidenceInputs(sources) {
              const all = [
                ...((sources && sources.reviews) || []),
                ...((sources && sources.comments) || []),
                ...((sources && sources.reviewComments) || []),
                ...((sources && sources.reactions) || []),
              ].filter(evidenceIsCodex);
              return {
                // A notice that also carries a P1/P2 is a finding, not proof of
                // unavailability, and must never open an episode.
                quotaNotices: all.filter((item) =>
                  evidenceIsCapacityNotice(item?.body) && !evidenceHasSeverity(item?.body)),
                // Everything else Codex actually produced. A reaction has no
                // body and still counts: it proves Codex is answering. A notice
                // that carries a P1/P2 counts here too — it is not proof of
                // unavailability, so it must at least close the episode rather
                // than vanish from both lists.
                realActivity: all.filter((item) =>
                  (!evidenceIsCapacityNotice(item?.body) || evidenceHasSeverity(item?.body)) &&
                  !evidenceIsTaskResult(item?.body)),
              };
            }

            function parseFallbackAttestations(body) {
              const found = [];
              const pattern = new RegExp(
                CLAUDE_FALLBACK_MARKER_PATTERN.source,
                CLAUDE_FALLBACK_MARKER_PATTERN.flags,
              );
              let match;
              while ((match = pattern.exec(String(body || ''))) !== null) {
                const parsed = {};
                for (const part of String(match[1] || '').trim().split(/\s+/)) {
                  if (!part) continue;
                  const equals = part.indexOf('=');
                  if (equals > 0) parsed[part.slice(0, equals)] = part.slice(equals + 1);
                }
                found.push(parsed);
              }
              return found;
            }

            function fallbackCount(value) {
              if (!/^\d{1,9}$/.test(String(value ?? ''))) return null;
              return Number(value);
            }

            function evaluateFallbackAttestation(attestation, headSha) {
              const exactHead = String(headSha || '').toLowerCase();
              if (!/^[a-f0-9]{40}$/.test(exactHead)) {
                return { accepted: false, blocking: false, reason: 'unknown_head' };
              }
              if (!attestation) {
                return { accepted: false, blocking: false, reason: 'no_attestation' };
              }
              if (String(attestation.provider || '') !== FALLBACK_PROVIDER) {
                return { accepted: false, blocking: false, reason: 'wrong_provider' };
              }
              const reviewedHead = String(attestation.reviewed_head || '').toLowerCase();
              if (!/^[a-f0-9]{40}$/.test(reviewedHead)) {
                return { accepted: false, blocking: false, reason: 'malformed_reviewed_head' };
              }
              if (reviewedHead !== exactHead) {
                return { accepted: false, blocking: false, reason: 'reviewed_head_mismatch' };
              }
              if (String(attestation.reason || '') !== FALLBACK_REASON) {
                return { accepted: false, blocking: false, reason: 'wrong_reason' };
              }
              const found = fallbackCount(attestation.findings_found);
              const fixed = fallbackCount(attestation.findings_fixed);
              const unresolvedP1 = fallbackCount(attestation.unresolved_p1);
              const unresolvedP2 = fallbackCount(attestation.unresolved_p2);
              if (found === null || fixed === null ||
                  unresolvedP1 === null || unresolvedP2 === null || fixed > found) {
                return { accepted: false, blocking: false, reason: 'malformed_counts' };
              }
              const validation = String(attestation.validation || '');
              if (!FALLBACK_VALIDATION_PATTERN.test(validation)) {
                return { accepted: false, blocking: false, reason: 'missing_validation' };
              }
              if (unresolvedP1 > 0 || unresolvedP2 > 0) {
                return {
                  accepted: false,
                  blocking: true,
                  reason: 'unresolved_fallback_finding',
                  severity: unresolvedP1 > 0 ? 'P1' : 'P2',
                };
              }
              if (String(attestation.verdict || '') !== FALLBACK_VERDICT) {
                return { accepted: false, blocking: false, reason: 'verdict_not_clean' };
              }
              return {
                accepted: true,
                blocking: false,
                reason: 'structured_fallback_clean',
                findingsFound: found,
                findingsFixed: fixed,
                validation,
              };
            }

            // Is a trusted Codex code-review quota episode open right now?
            //
            // `notices` are trusted-actor capacity notices; `realActivity` is
            // every OTHER trusted Codex surface (reviews, comments, review
            // comments, reactions) excluding non-binding task summaries.
            // Ordinary comments can never reach either list.
            //
            // Two ways an episode is current, both bound to real evidence:
            //   Route A — Codex declined on THIS head epoch. The head has not
            //     moved and Codex has not returned, so the decline still
            //     describes the present state.
            //   Route B — the decline predates this head epoch, but Codex has
            //     posted nothing since and the fallback review happened within
            //     QUOTA_EPISODE_TTL_MS of it. Codex simply stops answering on
            //     later pushes while its quota is out, so requiring a fresh
            //     per-head notice would reject genuine exhaustion; the TTL plus
            //     the closure rule keep it from authorizing anything forever.
            // Any real Codex activity newer than the newest notice CLOSES the
            // episode: Codex is demonstrably answering again.
            function evaluateQuotaEpisode(notices, options) {
              const settings = options || {};
              const itemAt = (item) => new Date(
                item?.created_at || item?.submitted_at || item?.at || 0,
              ).getTime();
              const newestOf = (items) => {
                let newest = null;
                for (const item of items || []) {
                  const at = itemAt(item);
                  if (!Number.isFinite(at) || at <= 0) continue;
                  if (newest === null || at > newest) newest = at;
                }
                return newest;
              };
              if (settings.codexSignalOnHead) {
                return { active: false, reason: 'codex_available_on_head', noticeAt: null };
              }
              const newestNotice = newestOf(notices);
              if (newestNotice === null) {
                return { active: false, reason: 'no_quota_notice', noticeAt: null };
              }
              const newestReal = newestOf(settings.realActivity);
              if (newestReal !== null && newestReal > newestNotice) {
                return {
                  active: false, reason: 'quota_episode_closed',
                  noticeAt: new Date(newestNotice),
                };
              }
              const observedAt = new Date(settings.headObservedAt || 0).getTime();
              if (!Number.isFinite(observedAt) || observedAt <= 0) {
                return { active: false, reason: 'head_epoch_unknown', noticeAt: null };
              }
              if (newestNotice >= observedAt) {
                return {
                  active: true, reason: 'trusted_quota_episode',
                  noticeAt: new Date(newestNotice),
                };
              }
              const attestedAt = Number(settings.attestedAt);
              if (
                Number.isFinite(attestedAt) && attestedAt >= newestNotice &&
                attestedAt - newestNotice <= QUOTA_EPISODE_TTL_MS
              ) {
                return {
                  active: true, reason: 'trusted_quota_episode',
                  noticeAt: new Date(newestNotice),
                };
              }
              return {
                active: false, reason: 'stale_quota_evidence',
                noticeAt: new Date(newestNotice),
              };
            }

            // Provenance must never credit Codex for a Claude review.
            function reviewEvidenceProvenance(authority) {
              if (authority === 'codex') return 'Codex exact-head review accepted';
              if (authority === FALLBACK_PROVIDER) {
                return 'Claude Code fallback review accepted for exact head; Codex quota unavailable';
              }
              return 'No accepted exact-head review evidence';
            }

            function attestationRunIsTrusted(run, attempt, commentAt, defaultBranch) {
              if (!run) return false;
              // Only the canonical producer workflow may mint evidence, and
              // only when it ran from the trusted default branch through an
              // explicit dispatch (which requires write access). A run started
              // from a PR ref would execute PR-controlled YAML, so an unknown
              // default branch fails closed rather than skipping the check.
              if (String(run.path || '') !== FALLBACK_ATTESTATION_WORKFLOW_PATH) return false;
              if (String(run.event || '') !== 'workflow_dispatch') return false;
              if (!defaultBranch) return false;
              if (String(run.head_branch || '') !== String(defaultBranch)) return false;
              if (Number(run.run_attempt) !== Number(attempt)) return false;
              // A run that refused to attest, or has not finished, proves
              // nothing. The producer posts its comment and then completes
              // successfully, so requiring that costs nothing and closes the
              // open-ended window a queued or failed run would otherwise leave.
              if (String(run.status || '') !== 'completed') return false;
              if (String(run.conclusion || '') !== 'success') return false;
              const startedAt = new Date(run.run_started_at || run.created_at || 0).getTime();
              const finishedAt = new Date(run.updated_at || 0).getTime();
              const at = Number(commentAt);
              if (!Number.isFinite(at) || !Number.isFinite(startedAt) || startedAt <= 0) return false;
              if (!Number.isFinite(finishedAt) || finishedAt <= 0) return false;
              if (at < startedAt - 5000) return false;
              if (at > finishedAt + 5000) return false;
              return true;
            }

            // The single canonical question every consumer asks. Returns
            // { accepted, blocking, severity, reason, episodeReason }. It must
            // never throw: an exception escaping here would reach the Gate's
            // technical fail-soft branch, which publishes GREEN. Absence of
            // evidence must look like absence of evidence, not like success.
            async function acceptedFallbackEvidence(options) {
              try {
                return await acceptedFallbackEvidenceUnsafe(options);
              } catch (e) {
                core.warning(
                  `Claude fallback review evidence lookup failed; treating it as no evidence: ${e.message}`,
                );
                return {
                  accepted: false, blocking: false, severity: null,
                  reason: 'fallback_lookup_failed',
                  episodeReason: 'fallback_lookup_failed',
                };
              }
            }

            async function acceptedFallbackEvidenceUnsafe(options) {
              const settings = options || {};
              const prNumber = Number(settings.prNumber);
              const headSha = String(settings.headSha || '').toLowerCase();
              const none = (reason) => ({
                accepted: false, blocking: false, severity: null, reason,
                episodeReason: reason,
              });
              // Requirement 1: only when repository policy explicitly allows it.
              if (String(process.env.CLAUDE_FALLBACK_REVIEW_ENABLED || '') !== 'true') {
                return none('fallback_policy_disabled');
              }
              if (!/^[a-f0-9]{40}$/.test(headSha)) return none('unknown_head');
              // Requirement 7/12: genuine Codex evidence on this head is the
              // authority; the quota episode is over.
              if (settings.codexSignalOnHead) return none('codex_available_on_head');
              // Requirement 5/7: an OUTDATED thread that nobody resolved still
              // holds a live Codex P1/P2. On the normal path a clean Codex
              // signal clears it because Codex itself re-examined the head; a
              // fallback performs no such re-examination, so it must not.
              // Checked on every evaluation, not only when the attestation was
              // minted: a resolved thread can be re-opened, and a late Codex
              // finding can arrive already-outdated, both without a new commit.
              //
              // Consumers may pass a function so the extra thread lookup only
              // happens after the cheap preconditions above have passed — a
              // repository with fallback disabled must not pay for it at all.
              const outdatedUnresolved =
                typeof settings.outdatedUnresolvedFinding === 'function'
                  ? await settings.outdatedUnresolvedFinding()
                  : settings.outdatedUnresolvedFinding;
              if (outdatedUnresolved) {
                return none('outdated_finding_needs_resolution');
              }

              const comments = settings.comments || [];
              const quotaNotices = (settings.quotaNotices || []);
              const realActivity = (settings.realActivity || []);
              // The episode is evaluated per candidate, because Route B is
              // bound to when the fallback review itself was attested.
              const episodeFor = (attestedAt) => evaluateQuotaEpisode(quotaNotices, {
                headObservedAt: settings.headObservedAt,
                realActivity,
                attestedAt,
                codexSignalOnHead: false,
              });
              const episode = episodeFor(Date.now());

              // Collect candidate attestations from trusted-identity comments
              // only, newest run first, bounded like the epoch markers are.
              const candidates = [];
              for (const comment of comments) {
                const login = String(comment?.user?.login || comment?.author?.login || '');
                if (login !== FALLBACK_ATTESTATION_AUTHOR) continue;
                // A comment body is mutable and editing does not move
                // created_at, so an edited marker can no longer be tied to the
                // run that wrote it. Treat any edit as tampering.
                if (comment?.updated_at && comment.updated_at !== comment.created_at) {
                  core.warning(
                    `PR #${prNumber}: ignoring an edited Claude fallback attestation comment.`,
                  );
                  continue;
                }
                for (const attestation of parseFallbackAttestations(comment?.body)) {
                  if (Number(attestation.pr) !== prNumber) continue;
                  candidates.push({
                    attestation,
                    runId: Number(attestation.run),
                    attempt: Number(attestation.attempt || 1),
                    commentAt: new Date(comment?.created_at || 0).getTime(),
                  });
                }
              }
              if (!candidates.length) return none('no_attestation');
              candidates.sort((a, b) => b.runId - a.runId);
              const bounded = candidates.slice(0, MAX_FALLBACK_ATTESTATION_CANDIDATES);

              let best = none('no_attestation');
              for (const candidate of bounded) {
                const evaluated = evaluateFallbackAttestation(candidate.attestation, headSha);
                if (!evaluated.accepted && !evaluated.blocking) {
                  if (best.reason === 'no_attestation') best = { ...evaluated, episodeReason: episode.reason };
                  continue;
                }
                // Authenticate the producing run before honouring the marker.
                let run = null;
                try {
                  if (!Number.isFinite(candidate.runId) || candidate.runId <= 0) throw new Error('bad run id');
                  // The caller injects a reader bound to a token that really
                  // holds `actions: read`. Merge Bot and the watchdog run their
                  // default client on AUTOMATION_PAT, which cannot be relied on
                  // for this read, so they pass their GITHUB_TOKEN reader.
                  if (typeof settings.fetchRunAttempt !== 'function') {
                    throw new Error('no authenticated run reader supplied');
                  }
                  run = await settings.fetchRunAttempt(candidate.runId, candidate.attempt);
                } catch (e) {
                  // Fail closed: an unverifiable attestation is not evidence.
                  core.warning(
                    `PR #${prNumber}: fallback attestation run ${candidate.runId} verification failed; ignoring it: ${e.message}`,
                  );
                  continue;
                }
                if (!attestationRunIsTrusted(
                  run, candidate.attempt, candidate.commentAt, settings.defaultBranch,
                )) {
                  core.warning(
                    `PR #${prNumber}: fallback attestation run ${candidate.runId} is not the canonical producer; ignoring it.`,
                  );
                  continue;
                }
                if (evaluated.blocking) {
                  return {
                    accepted: false, blocking: true,
                    severity: evaluated.severity || 'P1',
                    reason: 'unresolved_fallback_finding',
                    episodeReason: episode.reason,
                  };
                }
                const candidateEpisode = episodeFor(candidate.commentAt);
                if (!candidateEpisode.active) {
                  return {
                    accepted: false, blocking: false, severity: null,
                    reason: candidateEpisode.reason,
                    episodeReason: candidateEpisode.reason,
                  };
                }
                return {
                  accepted: true, blocking: false, severity: null,
                  reason: 'structured_fallback_clean',
                  episodeReason: candidateEpisode.reason,
                };
              }
              return best;
            }
            // ===== END CANONICAL EXACT-HEAD REVIEW EVIDENCE ==================

            async function hasCurrentHeadNonInlineFinding(prNumber, headSha) {
              const [reviews, comments] = await Promise.all([
                github.paginate(github.rest.pulls.listReviews, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                }),
                github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber, per_page: 100,
                }),
              ]);
              const headObservedAt = await observedHeadTransition(prNumber, headSha, comments);
              return (
                reviews.some((review) =>
                  TRUSTED_CODEX_LOGINS.has(review.user?.login || '') &&
                  signalTargetsHead(review, headSha, headObservedAt, 'submitted_at') &&
                  hasSeverity(review.body)
                ) ||
                comments.some((comment) =>
                  TRUSTED_CODEX_LOGINS.has(comment.user?.login || '') &&
                  signalTargetsHead(comment, headSha, headObservedAt, 'created_at') &&
                  hasSeverity(comment.body)
                )
              );
            }

            // Fetch every trusted Codex surface for a PR exactly once. Both the
            // Codex-signal test and the canonical fallback decision read from
            // the same snapshot, so they cannot disagree and the PR is not
            // paginated four times per evaluation.
            async function fetchCodexSurfaces(prNumber) {
              const [reviews, comments, reviewComments, reactions] = await Promise.all([
                github.paginate(github.rest.pulls.listReviews, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                }),
                github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber, per_page: 100,
                }),
                github.paginate(github.rest.pulls.listReviewComments, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                }),
                github.paginate(github.rest.reactions.listForIssue, {
                  owner, repo, issue_number: prNumber, per_page: 100,
                }),
              ]);
              return { reviews, comments, reviewComments, reactions };
            }

            async function codexSignalFromSurfaces(prNumber, headSha, surfaces, headObservedAt) {
              const { reviews, comments, reviewComments, reactions } = surfaces;
              const trustedAfterHead = (item, dateField) =>
                TRUSTED_CODEX_LOGINS.has(item.user?.login || '') &&
                !isCodexCapacityNotice(item.body) &&
                signalTargetsHead(item, headSha, headObservedAt, dateField);
              const hasTrustedCleanReaction = reactions.some((item) =>
                TRUSTED_CODEX_LOGINS.has(item.user?.login || '') &&
                item.content === '+1'
              );
              return (
                reviews.some((item) => trustedAfterHead(item, 'submitted_at')) ||
                comments.some((item) => trustedAfterHead(item, 'created_at')) ||
                reviewComments.some((item) => trustedAfterHead(item, 'created_at')) ||
                (
                  hasTrustedCleanReaction &&
                  await onlyObservedHead(prNumber, headSha, comments) &&
                  reactions.some((item) =>
                    TRUSTED_CODEX_LOGINS.has(item.user?.login || '') &&
                    reactionTargetsOnlyObservedHead(item, headObservedAt, true)
                  )
                )
              );
            }


            // An OUTDATED thread that nobody resolved still holds a live Codex
            // P1/P2. It does not block the normal Codex path (Codex re-examined
            // the head itself), but a Claude fallback performs no such
            // re-examination and must never clear it.
            async function hasOutdatedUnresolvedTrustedFinding(prNumber) {
              let cursor = null;
              do {
                const data = await github.graphql(
                  `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $cursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            isResolved
                            isOutdated
                            comments(first: 100) {
                              nodes { body author { login } }
                            }
                          }
                        }
                      }
                    }
                  }`,
                  { owner, repo, number: prNumber, cursor },
                );
                const connection = data.repository.pullRequest.reviewThreads;
                for (const thread of connection.nodes || []) {
                  if (thread.isResolved || !thread.isOutdated) continue;
                  if ((thread.comments?.nodes || []).some((comment) =>
                    TRUSTED_CODEX_LOGINS.has(comment.author?.login || '') &&
                    hasSeverity(comment.body)
                  )) return true;
                }
                cursor = connection.pageInfo.hasNextPage
                  ? connection.pageInfo.endCursor
                  : null;
              } while (cursor);
              return false;
            }

            // CANONICAL CONTRACT — Merge Bot must reach exactly the same
            // review-evidence verdict as Codex Gate and the watchdog:
            // normal Codex evidence OR approved Claude fallback evidence when
            // Codex is provably unavailable. Returns the truthful authority so
            // the merge log never credits Codex for a Claude review.
            async function hasCurrentHeadReviewEvidence(prNumber, headSha, defaultBranch) {
              const surfaces = await fetchCodexSurfaces(prNumber);
              const comments = surfaces.comments;
              const headObservedAt = await observedHeadTransition(prNumber, headSha, comments);
              const codexSignal = await codexSignalFromSurfaces(
                prNumber, headSha, surfaces, headObservedAt,
              );
              if (codexSignal) {
                return { accepted: true, authority: 'codex', blocking: false, reason: 'codex_exact_head' };
              }
              // Same shared collector as Codex Gate and the watchdog.
              const evidenceInputs = collectReviewEvidenceInputs(surfaces);
              const evidence = await acceptedFallbackEvidence({
                prNumber, headSha, headObservedAt, comments,
                // Lazy: a repository with fallback disabled never pays for it.
                outdatedUnresolvedFinding: () => hasOutdatedUnresolvedTrustedFinding(prNumber),
                quotaNotices: evidenceInputs.quotaNotices,
                realActivity: evidenceInputs.realActivity,
                codexSignalOnHead: false,
                defaultBranch,
                // fix #17 Part C pattern: Actions reads run on GITHUB_TOKEN,
                // not on AUTOMATION_PAT. Using the PAT here would fail closed
                // and make Merge Bot disagree with the Gate.
                fetchRunAttempt: (runId, attempt) => roPage(
                  `https://api.github.com/repos/${owner}/${repo}/actions/runs/${runId}/attempts/${attempt}`,
                ).then(({ data }) => data),
              });
              return {
                accepted: evidence.accepted,
                authority: evidence.accepted ? FALLBACK_PROVIDER : 'none',
                blocking: evidence.blocking,
                reason: evidence.reason,
              };
            }

            async function hasActiveTrustedBlocker(prNumber, headSha) {
              return (
                await hasActiveTrustedFinding(prNumber) ||
                await hasCurrentHeadNonInlineFinding(prNumber, headSha)
              );
            }

            async function escalationProvenance(prNumber) {
              const [events, issueComments, reviewComments, prCommits, currentPrResponse] = await Promise.all([
                github.paginate(
                  'GET /repos/{owner}/{repo}/issues/{issue_number}/events',
                  { owner, repo, issue_number: prNumber, per_page: 100 },
                ),
                github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber, per_page: 100,
                }),
                github.paginate(github.rest.pulls.listReviewComments, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                }),
                github.paginate(github.rest.pulls.listCommits, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                }),
                github.rest.pulls.get({ owner, repo, pull_number: prNumber }),
              ]);
              const comments = [...issueComments, ...reviewComments];
              const commitShas = new Set(prCommits.map((commit) => commit.sha));
              const currentHead = currentPrResponse.data.head.sha;
              const trustedLoopMarker = (comment) => {
                if (![OWNER_LOGIN, 'github-actions[bot]'].includes(comment.user?.login)) return null;
                const marker = String(comment.body || '').match(/<!-- ai-loop:v1\b([^>]*)-->/i);
                if (!marker) return null;
                const root = marker[1].match(/\broot_pr=(\d+)\b/i);
                const head = marker[1].match(/\bhead=([a-f0-9]{40})\b/i);
                if (!root || Number(root[1]) !== prNumber || !head || !commitShas.has(head[1])) return null;
                return { attributes: marker[1], head: head[1] };
              };
              const latestLabelEvent = (labelName) => events
                .filter((event) => (
                  (event.event === 'labeled' || event.event === 'unlabeled') &&
                  event.label && event.label.name === labelName
                ))
                .sort((a, b) =>
                  new Date(b.created_at || 0) - new Date(a.created_at || 0) ||
                  Number(b.id || 0) - Number(a.id || 0)
                )[0];
              const needsEvent = latestLabelEvent(LABEL_ESCALATE);
              const autoEvent = latestLabelEvent(LABEL_ESCALATE_AUTO);
              const needsAt = new Date(needsEvent?.created_at || 0).getTime();
              const autoAt = new Date(autoEvent?.created_at || 0).getTime();

              // A companion is valid only when its latest label event follows
              // the current needs-owner assignment. This rejects an orphaned
              // needs-owner-auto when a human later re-adds the hard stop.
              const companionOrdered = autoAt > needsAt || (
                autoAt === needsAt && Number(autoEvent?.id || 0) >= Number(needsEvent?.id || 0)
              );
              const companion = (
                needsEvent?.event === 'labeled' &&
                autoEvent?.event === 'labeled' &&
                needsEvent.actor?.login === 'github-actions[bot]' &&
                autoEvent.actor?.login === 'github-actions[bot]' &&
                Number.isFinite(needsAt) && Number.isFinite(autoAt) &&
                companionOrdered && autoAt - needsAt <= 5 * 60 * 1000
              );

              // Legacy labels need positive temporary-escalation evidence.
              // github-actions[bot] attribution alone is insufficient because
              // permanent fork/protected-path writers used the same actor.
              const nearbyWatchdogMarker = comments.some((comment) => {
                const marker = trustedLoopMarker(comment);
                const commentAt = new Date(comment.created_at || 0).getTime();
                return (
                  marker && marker.head === currentHead &&
                  /\bagent=watchdog\b/i.test(marker.attributes) && /\bstate=escalated\b/i.test(marker.attributes) &&
                  Number.isFinite(commentAt) && Number.isFinite(needsAt) &&
                  Math.abs(commentAt - needsAt) <= 5 * 60 * 1000
                );
              });
              const circuitBreakerMarkers = comments.filter((comment) => {
                const body = String(comment.body || '');
                const marker = trustedLoopMarker(comment);
                const commentAt = new Date(comment.created_at || 0).getTime();
                return (
                  marker &&
                  body.includes('[auto-triggered]') &&
                  /\battempt=\d+\b/i.test(marker.attributes) && /\bagent=claude\b/i.test(marker.attributes) && /\bstate=requested\b/i.test(marker.attributes) &&
                  Number.isFinite(commentAt) && Number.isFinite(needsAt) &&
                  commentAt <= needsAt && needsAt - commentAt <= 6 * 60 * 60 * 1000
                );
              });
              const positiveLegacyEvidence = (
                needsEvent?.event === 'labeled' && (
                  (needsEvent.actor?.login === 'github-actions[bot]' && circuitBreakerMarkers.length >= 3) ||
                  (needsEvent.actor?.login === OWNER_LOGIN && nearbyWatchdogMarker)
                )
              );
              const protectedReason = comments.some((comment) => {
                const body = String(comment.body || '');
                const marker = trustedLoopMarker(comment);
                const racedLabelEvent = marker?.attributes
                  .match(/\blabel_event=(\d+)\b/i)?.[1];
                return (
                  (marker && /\bstate=clear_race\b/i.test(marker.attributes) &&
                    Number(racedLabelEvent) === Number(needsEvent?.id || 0)) ||
                  /Auto-merge blocked: this PR touches protected path/i.test(body) ||
                  /skipped this fork-headed PR/i.test(body) ||
                  /fork-headed PR[^\n]*Escalated to needs-owner/is.test(body)
                );
              });
              return {
                companion,
                legacy: positiveLegacyEvidence && !protectedReason,
                needsEventId: Number(needsEvent?.id || 0),
                autoEventId: Number(autoEvent?.id || 0),
              };
            }

            async function transientClearKeptValidatedOwnership(
              prNumber, expectedNeedsEventId, expectedAutoEventId, hadAutoProvenance,
            ) {
              // Label deletion has no conditional API. Prove after the requests
              // that each deleted assignment was still the exact event validated
              // above. Any intervening human remove/re-add changes adjacency and
              // must abort the merge even when the label is absent again.
              // Serialize these reads so the event timeline is the final
              // ownership snapshot. A parallel, earlier timeline could miss an
              // add/remove transition visible only after the label snapshot.
              const currentResponse = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber,
              });
              const currentLabels = labelNames(currentResponse.data);
              if (currentLabels.has(LABEL_NO_AUTOMERGE) ||
                  currentLabels.has(LABEL_ESCALATE) ||
                  currentLabels.has(LABEL_ESCALATE_AUTO)) return false;
              const events = await github.paginate(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/events',
                { owner, repo, issue_number: prNumber, per_page: 100 },
              );
              const latestNoAutomergeEvent = events
                .filter((event) => (
                  (event.event === 'labeled' || event.event === 'unlabeled') &&
                  event.label?.name === LABEL_NO_AUTOMERGE
                ))
                .sort((a, b) =>
                  new Date(b.created_at || 0) - new Date(a.created_at || 0) ||
                  Number(b.id || 0) - Number(a.id || 0))[0];
              if (latestNoAutomergeEvent?.event === 'labeled') return false;

              const transitionIsDirectClear = (labelName, expectedEventId) => {
                const timeline = events
                  .filter((event) => (
                    (event.event === 'labeled' || event.event === 'unlabeled') &&
                    event.label?.name === labelName
                  ))
                  .sort((a, b) =>
                    new Date(b.created_at || 0) - new Date(a.created_at || 0) ||
                    Number(b.id || 0) - Number(a.id || 0));
                return timeline[0]?.event === 'unlabeled' &&
                  Number(timeline[1]?.id || 0) === Number(expectedEventId) &&
                  timeline[1]?.event === 'labeled';
              };

              return transitionIsDirectClear(LABEL_ESCALATE, expectedNeedsEventId) &&
                (!hadAutoProvenance ||
                  transitionIsDirectClear(LABEL_ESCALATE_AUTO, expectedAutoEventId));
            }

            async function restoreRaceHardStopIfOpen(prNumber) {
              // A mismatched label timeline means the cleared assignment is no
              // longer proven automation-owned. Restore only needs-owner, never
              // its transient companion, so later passes keep it fail-closed.
              const { data: current } = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber,
              });
              const currentLabels = labelNames(current);
              if (currentLabels.has(LABEL_ESCALATE_AUTO)) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber,
                  name: LABEL_ESCALATE_AUTO,
                });
              }
              if (!currentLabels.has(LABEL_ESCALATE)) {
                try {
                  await github.rest.issues.addLabels({
                    owner, repo, issue_number: prNumber,
                    labels: [LABEL_ESCALATE],
                  });
                } catch (e) {
                  // If the ordinary hard stop cannot be restored, fall back to
                  // the policy's permanent stop before surfacing the error.
                  await persistPermanentStop(prNumber, 'needs-owner restore failed');
                  throw e;
                }
              }
              // Persist why this restored stop must never be treated as a
              // nearby watchdog-owned legacy escalation on a later pass. If
              // marker persistence fails, attach the permanent policy stop.
              try {
                const restoredProvenance = await escalationProvenance(prNumber);
                if (!restoredProvenance.needsEventId) {
                  throw new Error('restored needs-owner label event is unavailable');
                }
                await github.rest.issues.createComment({
                  owner, repo, issue_number: prNumber,
                  body: `<!-- ai-loop:v1 root_pr=${prNumber} head=${current.head.sha} agent=merge-bot state=clear_race label_event=${restoredProvenance.needsEventId} -->\nMerge Bot detected a concurrent needs-owner transition while clearing an automated escalation. The restored needs-owner is a permanent manual/unknown hard stop.`,
                });
              } catch (e) {
                await persistPermanentStop(prNumber, 'clear-race marker persistence failed');
                throw e;
              }
            }

            async function persistPermanentStop(prNumber, reason) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNumber,
                labels: [LABEL_NO_AUTOMERGE],
              });
              core.warning(`#${prNumber}: persisted no-automerge because ${reason}`);
            }

            async function restoreTransientIfOpen(prNumber) {
              // Re-read immediately before restoring. A human may add a new
              // needs-owner after the bot cleared the old transient labels but
              // before a failed merge returns. Never attach (or leave) auto
              // provenance beside that new manual stop.
              const { data: current } = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber,
              });
              if (current.state !== 'open') return;
              const currentLabels = labelNames(current);
              if (currentLabels.has(LABEL_ESCALATE)) {
                if (currentLabels.has(LABEL_ESCALATE_AUTO)) {
                  // The first clear request may have failed without changing
                  // either label. In that case the original automation-owned
                  // pair is still valid: leave it intact for the next pass.
                  // If a human removed/re-added needs-owner in the meantime,
                  // companion provenance is false and only the stale companion
                  // is removed. A provenance read failure keeps both labels and
                  // therefore remains fail-closed.
                  let currentProvenance;
                  try {
                    currentProvenance = await escalationProvenance(prNumber);
                  } catch (e) {
                    core.warning(`#${prNumber}: could not classify live transient pair during restoration; preserving both labels: ${e.message}`);
                    return;
                  }
                  if (currentProvenance.companion) {
                    core.warning(`#${prNumber}: original transient escalation is still intact after failed clear/merge; leaving both labels for retry`);
                    return;
                  }
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: prNumber,
                    name: LABEL_ESCALATE_AUTO,
                  });
                }
                core.warning(`#${prNumber}: live needs-owner appeared before transient restoration; preserving it as a manual/unknown hard stop`);
                return;
              }

              // A partially completed clear can leave only the companion.
              // Remove it before rebuilding the ordered bot-attributed pair;
              // otherwise no fresh needs-owner-auto label event exists to
              // prove that the restored hard stop belongs to automation.
              if (currentLabels.has(LABEL_ESCALATE_AUTO)) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber,
                  name: LABEL_ESCALATE_AUTO,
                });
              }

              const { data: beforeAdd } = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber,
              });
              if (beforeAdd.state !== 'open') return;
              if (labelNames(beforeAdd).has(LABEL_ESCALATE)) {
                core.warning(`#${prNumber}: needs-owner appeared while rebuilding transient provenance; preserving it as manual/unknown`);
                return;
              }

              const definitions = [
                { name: LABEL_ESCALATE, color: 'd93f0b', description: 'Escalation — automation stopped, human needed' },
                { name: LABEL_ESCALATE_AUTO, color: 'fbca04', description: 'Provenance: needs-owner was added by temporary PR automation escalation' },
              ];
              for (const label of definitions) {
                try {
                  await actionLabelRequest('POST', `/repos/${owner}/${repo}/labels`, label);
                } catch (e) {
                  if (e.status !== 422) throw e;
                }
              }
              // Add sequentially so timeline authority has an ordered
              // github-actions[bot] needs-owner -> needs-owner-auto pair.
              for (const label of definitions) {
                await actionLabelRequest(
                  'POST',
                  `/repos/${owner}/${repo}/issues/${prNumber}/labels`,
                  { labels: [label.name] },
                );
              }
              const restoredProvenance = await escalationProvenance(prNumber);
              if (!restoredProvenance.companion) {
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: prNumber,
                    name: LABEL_ESCALATE_AUTO,
                  });
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
                core.warning(`#${prNumber}: restored hard stop lacked exact bot provenance; removed companion and left needs-owner fail-closed`);
                return;
              }
              core.info(`#${prNumber}: restored transient escalation after merge did not complete`);
            }

            // minimatch-style glob -> RegExp (supports **, *, ?). Inlined to
            // avoid depending on a package not bundled with github-script.
            function globToRegExp(glob) {
              let re = '';
              for (let i = 0; i < glob.length; i++) {
                const c = glob[i];
                if (c === '*') {
                  if (glob[i + 1] === '*') {
                    re += '.*';
                    i++;
                    if (glob[i + 1] === '/') i++;   // **/ matches zero or more dirs
                  } else {
                    re += '[^/]*';
                  }
                } else if (c === '?') {
                  re += '[^/]';
                } else if ('.+^${}()|[]\\'.includes(c)) {
                  re += '\\' + c;
                } else {
                  re += c;
                }
              }
              return new RegExp('^' + re + '$');
            }

            async function telegram(text) {
              const tgToken = process.env.TELEGRAM_BOT_TOKEN;
              const tgChat = process.env.TELEGRAM_CHAT_ID;
              if (!tgToken || !tgChat) return;
              try {
                await fetch(`https://api.telegram.org/bot${tgToken}/sendMessage`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ chat_id: tgChat, text, parse_mode: 'HTML', disable_web_page_preview: true }),
                });
              } catch (e) {
                core.info(`Telegram failed (ignored): ${e.message}`);
              }
            }

            const isClaudeBot = (login) =>
              !!login && login.endsWith('[bot]') && login.toLowerCase().includes('claude');

            // Gather candidate open PRs (full pagination).
            const allOpen = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });

            // Ensure the permanent opt-out label is available everywhere the
            // synced workflow runs. Never remove it automatically.
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL_NO_AUTOMERGE, color: 'b60205',
                description: 'Permanent human opt-out: Merge Bot must not merge this PR',
              });
            } catch (e) {
              if (e.status !== 422) core.info(`createLabel ${LABEL_NO_AUTOMERGE} failed (ignored): ${e.message}`);
            }

            // Normal same-repository owner PRs are first-class candidates,
            // alongside the established explicit/Claude/sync paths. A fork is
            // never trusted by its title or branch name.
            const candidates = allOpen.filter(isAutoMergeCandidate);

            if (!candidates.length) {
              core.info('No automerge candidates.');
              return;
            }

            const OK = new Set(['success', 'neutral', 'skipped']);

            for (const prLite of candidates) {
              const prNumber = prLite.number;
              try {
                // Re-fetch full PR for current labels, mergeability and head SHA.
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });

                if (!isAutoMergeCandidate(pr)) {
                  core.info(`#${prNumber}: no longer an automerge candidate, skip`);
                  continue;
                }
                const initialLabels = labelNames(pr);
                const hasNeedsOwner = initialLabels.has(LABEL_ESCALATE);
                const hasAutoProvenance = initialLabels.has(LABEL_ESCALATE_AUTO);
                let initialProvenance = { companion: false, legacy: false };
                if (hasNeedsOwner) {
                  try {
                    initialProvenance = await escalationProvenance(prNumber);
                  } catch (e) {
                    core.warning(`#${prNumber}: needs-owner provenance lookup failed; keeping human stop: ${e.message}`);
                  }
                }
                const transientEscalation = hasNeedsOwner && (
                  (hasAutoProvenance && initialProvenance.companion) ||
                  (!hasAutoProvenance && initialProvenance.legacy)
                );
                if (hasNeedsOwner && !transientEscalation) {
                  core.info(`#${prNumber}: manual/unknown needs-owner is a hard stop`);
                  continue;
                }
                // mergeable=null is ambiguous while GitHub computes it. Require
                // an affirmative true before any transient label can clear.
                if (pr.mergeable !== true) {
                  core.info(`#${prNumber}: mergeability is not affirmatively true, skip`);
                  continue;
                }

                const headSha = pr.head.sha;

              // All check runs on the head sha (paginate). READ → GITHUB_TOKEN
              // (fix #17 Part C): a fine-grained PAT can't hold Checks perm.
              const checkRunsAll = await roCheckRuns(headSha);
              // fix #17 Part B: DROP concurrency-cancelled check-runs — a gate run
              // that read Codex's 👍 and created the green verdict tile, then got
              // cancelled mid-verdict by cancel-in-progress, left a `cancelled`
              // authoritative check-codex-status that stranded a green PR
              // (INCIDENT 1). Cancelled runs are noise, never a verdict. Keep
              // in-progress runs (conclusion null) so anyRunning still works; an
              // older SUCCESS on the same head (checks are pinned to the head SHA)
              // stays authoritative past the cancelled tail. If EVERY
              // check-codex-status on the head is cancelled, the CODEX_CHECK lookup
              // finds nothing → fail-closed skip (unchanged).
              const checkRuns = checkRunsAll.filter((c) => c.conclusion !== 'cancelled');
              // All commit statuses on the head sha (paginate). READ → GITHUB_TOKEN.
              const statuses = await roStatuses(headSha);

              // Keep ONLY the latest check run per name. The Codex gate emits
              // multiple `check-codex-status` runs on the same head over a PR's
              // life — an early PENDING/red run before Codex reviews, then a
              // SUCCESS run after. GitHub's own merge gating uses the most
              // recent run per name; scanning EVERY run would trip anyFailed on
              // the stale early-red run and skip a PR whose latest gate is green
              // (the reason merge-bot never merged). Sort by completion recency
              // (completed_at, else started_at) descending and keep the first
              // occurrence of each name. (Commit statuses below are already
              // deduped per context — newest-first — so they're left as-is.)
              const recency = (c) => new Date(c.completed_at || c.started_at || 0).getTime();
              const seenNames = new Set();
              const latestCheckRuns = [...checkRuns]
                .filter((c) => !NON_BLOCKING_DIAGNOSTIC_CHECKS.has(c.name))
                .sort((a, b) => recency(b) - recency(a))
                .filter((c) => (seenNames.has(c.name) ? false : (seenNames.add(c.name), true)));

              let anyRunning = false;
              let anyFailed = false;
              for (const c of latestCheckRuns) {
                if (c.status !== 'completed') { anyRunning = true; continue; }
                if (!OK.has(c.conclusion)) anyFailed = true;
              }
              // Latest status per context (statuses are newest-first).
              const latestByCtx = new Map();
              for (const s of statuses) {
                if (!latestByCtx.has(s.context)) latestByCtx.set(s.context, s.state);
              }
              for (const state of latestByCtx.values()) {
                if (state === 'pending') anyRunning = true;
                else if (state !== 'success') anyFailed = true;
              }

              if (anyFailed) { core.info(`#${prNumber}: a check failed, skip`); continue; }
              if (anyRunning) { core.info(`#${prNumber}: checks still running, skip`); continue; }

              // Codex gate is MANDATORY and must FAIL CLOSED: the check must
              // EXIST on the head SHA and be success. If check-codex-status is
              // absent (a repo that hasn't received codex-gate, or the gate
              // hasn't run yet), do NOT merge — never merge an ungated PR.
              const codex = latestCheckRuns.find((c) => c.name === CODEX_CHECK);
              if (!codex || codex.status !== 'completed' || codex.conclusion !== 'success') {
                core.info(`#${prNumber}: ${CODEX_CHECK} missing or not success, skip`);
                continue;
              }

              // Defense in depth: the exact-head gate must be green AND the
              // current head must have a trusted Codex signal unless this is
              // the established grace-eligible trusted sync. This prevents a
              // persisted override-green check from surviving override label
              // removal before Codex reviews the head.
              let reviewEvidence = { accepted: true, authority: 'none', blocking: false, reason: 'not_required' };
              if (!initialLabels.has(CODEX_OVERRIDE_LABEL) && !isTrustedSync(pr)) {
                reviewEvidence = await hasCurrentHeadReviewEvidence(
                  prNumber, headSha, pr.base?.repo?.default_branch,
                );
                if (reviewEvidence.blocking) {
                  core.info(`#${prNumber}: Claude fallback review reports unresolved P1/P2, skip`);
                  continue;
                }
                if (!reviewEvidence.accepted) {
                  core.info(`#${prNumber}: no accepted exact-head review evidence (${reviewEvidence.reason}), skip`);
                  continue;
                }
              }
              // The authoritative current review-thread state must also
              // contain no unresolved, non-outdated trusted P1/P2 finding.
              if (
                !initialLabels.has(CODEX_OVERRIDE_LABEL) &&
                await hasActiveTrustedBlocker(prNumber, headSha)
              ) {
                core.info(`#${prNumber}: active trusted Codex P1/P2 finding, skip`);
                continue;
              }

              // Protected-path guard: .claude-guard.json on the base branch.
              let guard = null;
              try {
                const { data: gf } = await github.rest.repos.getContent({
                  owner, repo, path: '.claude-guard.json', ref: pr.base.ref,
                });
                guard = JSON.parse(Buffer.from(gf.content, 'base64').toString('utf8'));
              } catch (e) { /* no guard file — nothing protected */ }

              if (guard && Array.isArray(guard.protected) && guard.protected.length) {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                });
                const regexes = guard.protected.map(globToRegExp);
                const hits = files
                  .map((f) => f.filename)
                  .filter((name) => regexes.some((re) => re.test(name)));
                if (hits.length && !(await mayAutoMergeProtectedPaths(pr))) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: LABEL_AUTOMERGE });
                  } catch (e) { /* maybe not present */ }
                  // Upsert the escalation label first — addLabels only attaches
                  // labels that already EXIST, so on a fresh repo needs-owner
                  // must be created before it can be applied.
                  try {
                    await github.rest.issues.createLabel({ owner, repo, name: LABEL_ESCALATE, color: 'd93f0b', description: 'Escalation — automation stopped, human needed' });
                  } catch (e) { if (e.status !== 422) core.info(`createLabel ${LABEL_ESCALATE} failed (ignored): ${e.message}`); }
                  await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: [LABEL_ESCALATE] });
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: prNumber,
                    body: `⛔ Auto-merge blocked: this PR touches protected path(s) listed in \`.claude-guard.json\`:\n${hits.map((h) => `- \`${h}\``).join('\n')}\n\nAdded \`${LABEL_ESCALATE}\` — a human must review and merge.`,
                  });
                  await telegram(`⛔ <b>${repo}</b> PR #${prNumber} touches protected paths — escalated to needs-owner.`);
                  core.info(`#${prNumber}: protected path hit, escalated.`);
                  continue;
                }
                if (hits.length) {
                  core.info(`#${prNumber}: protected paths reviewed on trusted owner/sync PR; exact-head gates remain mandatory`);
                }
              }

              // Re-fetch immediately before clearing a transient escalation.
              // This catches a moved head, new draft/stop label, or changed
              // mergeability after the initial evaluation. The SHA-pinned merge
              // below remains the final race guard.
              const { data: finalPr } = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber,
              });
              const finalLabels = labelNames(finalPr);
              if (
                !isAutoMergeCandidate(finalPr) ||
                finalPr.mergeable !== true || finalPr.head.sha !== headSha
              ) {
                core.info(`#${prNumber}: automerge eligibility or PR/head changed after validation, skip`);
                continue;
              }
              if (finalLabels.has(LABEL_NO_AUTOMERGE)) {
                core.info(`#${prNumber}: no-automerge appeared after validation, hard stop`);
                continue;
              }
              if (!finalLabels.has(CODEX_OVERRIDE_LABEL) && !isTrustedSync(finalPr)) {
                // Revalidate the identical canonical decision against the final
                // candidate: a commit or a returning Codex finding between the
                // two checks must still stop the merge.
                const finalEvidence = await hasCurrentHeadReviewEvidence(
                  prNumber, headSha, finalPr.base?.repo?.default_branch,
                );
                if (finalEvidence.blocking || !finalEvidence.accepted) {
                  core.info(`#${prNumber}: exact-head review evidence missing after validation (${finalEvidence.reason}), skip`);
                  continue;
                }
                reviewEvidence = finalEvidence;
              }
              if (
                !finalLabels.has(CODEX_OVERRIDE_LABEL) &&
                await hasActiveTrustedBlocker(prNumber, headSha)
              ) {
                core.info(`#${prNumber}: trusted P1/P2 appeared after validation, skip`);
                continue;
              }

              let clearedTransient = false;
              const finalHasNeedsOwner = finalLabels.has(LABEL_ESCALATE);
              const finalHasAutoProvenance = finalLabels.has(LABEL_ESCALATE_AUTO);
              if (finalHasNeedsOwner) {
                let finalProvenance = { companion: false, legacy: false };
                try {
                  finalProvenance = await escalationProvenance(prNumber);
                } catch (e) {
                  core.warning(`#${prNumber}: final needs-owner provenance lookup failed; preserving hard stop: ${e.message}`);
                }
                const stillTransient = finalHasAutoProvenance
                  ? finalProvenance.companion
                  : finalProvenance.legacy;
                if (!stillTransient) {
                  core.info(`#${prNumber}: manual needs-owner appeared after validation, hard stop`);
                  continue;
                }
                try {
                  // Remove the stop first, then its provenance. If either call
                  // fails, restore both labels and fail closed for this pass.
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: prNumber, name: LABEL_ESCALATE,
                  });
                  if (finalHasAutoProvenance) {
                    await github.rest.issues.removeLabel({
                      owner, repo, issue_number: prNumber,
                      name: LABEL_ESCALATE_AUTO,
                    });
                  }
                  const clearStillOwned = await transientClearKeptValidatedOwnership(
                    prNumber,
                    finalProvenance.needsEventId,
                    finalProvenance.autoEventId,
                    finalHasAutoProvenance,
                  );
                  if (!clearStillOwned) {
                    try {
                      await restoreRaceHardStopIfOpen(prNumber);
                    } catch (restoreError) {
                      core.warning(`#${prNumber}: raced hard-stop restore failed: ${restoreError.message}`);
                      // Do not suppress restoration failure until a durable
                      // permanent stop exists for all later merge-bot runs.
                      await persistPermanentStop(prNumber, 'raced hard-stop restoration failed');
                    }
                    core.warning(`#${prNumber}: needs-owner ownership changed during clear; restored a fail-closed hard stop and skipped merge`);
                    continue;
                  }
                  clearedTransient = true;
                  core.info(`#${prNumber}: cleared transient needs-owner${finalHasAutoProvenance ? ' + needs-owner-auto' : ' (proven legacy automation event)'} after exact-head fully-green validation; continuing to merge`);
                } catch (e) {
                  try {
                    await restoreTransientIfOpen(prNumber);
                  } catch (restoreError) {
                    core.warning(`#${prNumber}: transient-label restore failed: ${restoreError.message}`);
                    await persistPermanentStop(prNumber, 'transient-label restoration failed');
                  }
                  core.warning(`#${prNumber}: transient-label clear failed; skip: ${e.message}`);
                  continue;
                }
              }

              // Squash-merge with the PAT so the push to the base branch
              // triggers downstream workflows. `sha: headSha` pins the merge to
              // the exact commit we just evaluated — if the head moved between
              // the check evaluation and here, GitHub returns 409 and we do NOT
              // merge an unreviewed/unchecked commit. Idempotent: a parallel run
              // may already have merged (405/409) — swallow both and skip this
              // pass (the next event re-evaluates the new head).
              try {
                const { data: mergeResult } = await github.rest.pulls.merge({
                  owner, repo, pull_number: prNumber, merge_method: 'squash', sha: headSha,
                });
                if (!mergeResult.merged) {
                  if (clearedTransient) await restoreTransientIfOpen(prNumber);
                  core.warning(`#${prNumber}: merge API did not merge: ${mergeResult.message || 'unknown reason'}`);
                  continue;
                }
                // Truthful provenance: never record "Codex reviewed" for a
                // merge that a Claude Code fallback review actually cleared.
                core.info(
                  `#${prNumber}: merged ✅ — ${reviewEvidenceProvenance(reviewEvidence.authority)}`,
                );
              } catch (e) {
                if (clearedTransient) {
                  try {
                    await restoreTransientIfOpen(prNumber);
                  } catch (restoreError) {
                    core.warning(`#${prNumber}: transient-label restore after merge error failed: ${restoreError.message}`);
                  }
                }
                if (e.status === 405 || e.status === 409) {
                  core.info(`#${prNumber}: head moved / already merged / not mergeable (${e.status}), skip`);
                  continue;
                }
                // fail-soft: an unexpected merge error on ONE PR must not crash
                // the whole merge-bot job — a `throw` here reds the workflow and
                // blocks every OTHER candidate PR, contradicting the fail-soft
                // design ("missing PAT → GREEN"). The merge is idempotent and
                // re-evaluated on the next Codex Gate success, so losing this
                // pass costs nothing. Surface it as a warning and move on.
                core.warning(`#${prNumber}: unexpected merge error (${e.status || '?'}), skipping this PR: ${e.message}`);
                continue;
              }

              // Delete the head branch (same-repo branches only, best-effort).
              if (pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`) {
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` });
                } catch (e) { core.info(`branch delete skipped: ${e.message}`); }
              }

              // If the PR closed a ci-doctor Issue, close it with a summary.
              const linked = [...(pr.body || '').matchAll(/(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi)]
                .map((m) => parseInt(m[1], 10));
              for (const issNum of new Set(linked)) {
                try {
                  const { data: iss } = await github.rest.issues.get({ owner, repo, issue_number: issNum });
                  const isDoctor = (iss.labels || []).some((l) => (l.name || l) === 'ci-doctor');
                  if (iss.state === 'open' && isDoctor) {
                    await github.rest.issues.createComment({
                      owner, repo, issue_number: issNum,
                      body: `✅ Fixed by #${prNumber} (squash-merged into \`${pr.base.ref}\`). Closing.`,
                    });
                    await github.rest.issues.update({ owner, repo, issue_number: issNum, state: 'closed' });
                  }
                } catch (e) { core.info(`issue #${issNum} close skipped: ${e.message}`); }
              }
              } catch (e) {
                // A bad API response or policy-evaluation error on one PR must
                // never prevent other independently safe candidates from being
                // evaluated in this run.
                core.warning(`#${prNumber}: unexpected evaluation error; skipping only this PR: ${e.message}`);
              }
            }
