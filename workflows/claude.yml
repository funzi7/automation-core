name: Claude Fixer

# Generic workflow — synced from automation-core to every participating
# repo. Part of the Self-Healing Loop:
#   ci-doctor (opens claude-fix Issue) → THIS (fixes, opens PR) →
#   codex-gate (reviews) → merge-bot (merges when green).
#
# fail-soft: the first step checks whether ANTHROPIC_API_KEY is set. If
# it is empty (repo intentionally has no key, to restrain cost), the job
# exits GREEN with a log notice instead of failing red. So syncing this
# file to a key-less repo never produces failures and burns ~0 minutes.
#
# Loop-trigger trap: a PR opened with the default GITHUB_TOKEN does NOT
# trigger other workflows (GitHub loop protection). Issue-mode Claude uses
# only the short-lived repository token and API commit signing; after the
# model step a trusted scrub removes its git credential, then a trusted
# post-step alone uses AUTOMATION_PAT to open the exact controlled branch PR.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, labeled, assigned]

# One fix at a time per Issue/PR. cancel-in-progress: FALSE — a Claude run
# costs money by the minute, so we must NEVER cancel one that is already
# burning time. A second event for the same Issue/PR queues BEHIND the
# running one (serialized, not parallel, not cancelled). The real defense
# against duplicate runs is upstream: each event maps to exactly one clause
# in the job `if:` below (no single action fires two runs), and
# codex-auto-fix no longer wakes on Issue events at all.
concurrency:
  group: claude-fix-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read        # Claude reads CI run logs on PRs/Issues
  id-token: write      # OIDC for the action (harmless if unused)

jobs:
  claude:
    # Trigger on: owner-authored @claude mention in a comment, an assigned Issue,
    # or an Issue labeled `claude-fix` (the label_trigger path ci-doctor uses).
    # fix #26 kill-switch: flip the repo Actions var CLAUDE_ENABLED=false while the
    # Anthropic credit is exhausted to skip even the ~17s billing bounce (absent
    # var = enabled). Wraps the existing trigger condition, never replaces it.
    # Public-repo cost guard: arbitrary external @claude comments must not consume
    # paid fixer capacity. Internal loop comments use AUTOMATION_PAT and are owner-authored.
    if: |
      vars.CLAUDE_ENABLED != 'false' && (
        (github.event_name == 'issue_comment' &&
         github.event.comment.user.login == github.repository_owner &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
         github.event.comment.user.login == github.repository_owner &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.action == 'assigned') ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude-fix') ||
        (github.event_name == 'issues' && github.event.action == 'opened' && contains(join(github.event.issue.labels.*.name, ','), 'claude-fix'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Fail-soft check for ANTHROPIC_API_KEY
        id: keycheck
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set in this repo — skipping Claude Fixer (fail-soft, no error)."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve PR target for comment triggers
        id: pr_context
        if: steps.keycheck.outputs.has_key == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let prNumber = null;
            if (context.eventName === 'issue_comment' && context.payload.issue?.pull_request) {
              prNumber = context.payload.issue.number;
            } else if (context.eventName === 'pull_request_review_comment' && context.payload.pull_request) {
              prNumber = context.payload.pull_request.number;
            }

            core.setOutput('is_pr_comment', prNumber ? 'true' : 'false');
            if (!prNumber) {
              core.info('No PR target for this event; using Issue/new-branch path.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });
            const sameRepo =
              !!(pr.head && pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`);
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('same_repo_pr', sameRepo ? 'true' : 'false');
            core.setOutput('head_ref', pr.head.ref || '');
            core.setOutput('head_sha', pr.head.sha || '');
            core.setOutput('head_repo', pr.head.repo?.full_name || '');
            core.setOutput('base_ref', pr.base?.ref || '');
            if (sameRepo) {
              core.info(`PR #${prNumber}: same-repository head ${pr.head.ref} @ ${pr.head.sha}; Claude may write to the original head branch.`);
            } else {
              core.warning(`PR #${prNumber}: fork head ${pr.head.repo?.full_name || '(unknown)'}/${pr.head.ref}; skipping Claude writable checkout/run.`);
            }

      - name: Skip fork-headed PR safely
        if: steps.keycheck.outputs.has_key == 'true' && steps.pr_context.outputs.is_pr_comment == 'true' && steps.pr_context.outputs.same_repo_pr != 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = parseInt('${{ steps.pr_context.outputs.pr_number }}', 10);
            const headSha = '${{ steps.pr_context.outputs.head_sha }}';
            const headRepo = '${{ steps.pr_context.outputs.head_repo }}';
            const comment = context.payload.comment;
            const attemptMatch = String(comment?.body || '').match(/ai-loop:v1[^>]*\battempt=(\d+)/);
            const attemptAttr = attemptMatch ? ` attempt=${parseInt(attemptMatch[1], 10)}` : '';
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: 'needs-owner', color: 'd93f0b',
                description: 'Escalation — automation stopped, human needed',
              });
            } catch (e) { if (e.status !== 422) core.info(`createLabel needs-owner failed (ignored): ${e.message}`); }
            try {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNumber, labels: ['needs-owner'],
              });
            } catch (e) { core.info(`addLabel needs-owner failed (ignored): ${e.message}`); }
            try {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `<!-- ai-loop:v1 root_pr=${prNumber} head=${headSha}${attemptAttr} agent=claude state=fixer_error -->\nClaude skipped this fork-headed PR (${headRepo}) for security: writable fixer credentials are not used on fork code. Escalated to needs-owner.`,
              });
            } catch (e) { core.info(`fork-skip marker failed (ignored): ${e.message}`); }
            core.warning(`PR #${prNumber}: fork-headed PR skipped before checkout/Claude run; no writable credentials were exposed.`);

      - name: Checkout repository for Issue/new-PR path
        if: steps.keycheck.outputs.has_key == 'true' && steps.pr_context.outputs.is_pr_comment != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Run Claude Code (Issue/new-PR path)
        id: claude_issue
        if: steps.keycheck.outputs.has_key == 'true' && steps.pr_context.outputs.is_pr_comment != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Issue-mode Claude never receives AUTOMATION_PAT. The trusted
          # post-step alone uses it to create the exact action-controlled PR.
          github_token: ${{ github.token }}
          # The action creates commits through its constrained GitHub file-ops
          # MCP server, so Issue-mode needs no generic shell/interpreter tool.
          use_commit_signing: true
          trigger_phrase: "@claude"
          label_trigger: "claude-fix"
          branch_prefix: "claude/"
          # fix #16: expose the SDK transcript ONLY when the repo opts in via the
          # Actions variable CLAUDE_SHOW_FULL_OUTPUT == 'true'. Default (var unset
          # or any other value) keeps today's hidden output ("full output hidden
          # for security") — the safe default for PUBLIC downstreams, where the
          # transcript can echo file contents into world-readable logs. On a
          # PRIVATE repo, flip the repo Actions var to 'true' temporarily to
          # enumerate permission denials BY TOOL NAME (an error_max_turns run
          # reports permission_denials_count but hides WHICH tools were denied, so
          # the count alone can't tune --allowedTools), then flip it back.
          show_full_output: ${{ vars.CLAUDE_SHOW_FULL_OUTPUT == 'true' }}
          # --max-turns 50 + a no-shell Issue-mode allowlist. The previous
          # --max-turns 20 + narrow per-subcommand list caused error_max_turns
          # on paywall-bot #49: the fixer kept trying tools OUTSIDE the allowlist
          # (11 permission_denials), burning all 20 turns on denial churn without
          # delivering a fix. The action supplies constrained workspace edits
          # and API commit tools. No Bash, interpreter, package runner, generic
          # write tool, git CLI, or gh CLI is granted in this untrusted Issue/log
          # path. The PR's CI remains the executable-code validation boundary.
          claude_args: |
            --max-turns 50
            --allowedTools "Read,Glob,Grep"
          additional_permissions: |
            actions: read
          prompt: |
            You are the autonomous fixer in a self-healing CI loop. You were
            invoked on a GitHub Issue in this repository.

            If triggered by a `claude-fix` Issue (opened by ci-doctor):
              1. Read the Issue body: it has the failed workflow name, the
                 failed job names, a link to the failing run, and a tail of the
                 failing job logs. Diagnose the ROOT CAUSE from those logs — do
                 not guess.
              2. The action has already checked out its controlled `claude/*`
                 branch. Work only on that branch; do not create or switch branches.
              3. Apply the minimal fix. If the repo has a CLAUDE.md with a
                 build/test/gate command, OBEY it and run that gate locally;
                 it must be green before you finish.
              4. Commit and push the current branch. Do not open a PR yourself;
                 the trusted post-step creates it from the action's exact branch.
              5. Do NOT merge anything — codex-gate reviews the resulting PR and
                 merge-bot merges once everything is green.

            Prefer the allowed tools and do NOT attempt tools outside the allowlist (denied calls waste your turn budget); the PR's CI (codex-gate) is the final validation, so do not block on running the full suite locally if the sandbox can't.

            If triggered by an @claude mention on an Issue, follow the request
            in the comment on the action-controlled branch. Commit and push; the
            trusted post-step opens the PR. Do not merge it yourself.

      - name: Scrub Issue-mode model credentials
        id: scrub_issue_credentials
        if: ${{ always() && steps.keycheck.outputs.has_key == 'true' && steps.pr_context.outputs.is_pr_comment != 'true' && steps.claude_issue.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader" 2>/dev/null || true
          git config --local --unset-all credential.helper 2>/dev/null || true
          git remote set-url origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          if grep -Eqi '(x-access-token|authorization[[:space:]]*=|credential\.helper)' .git/config; then
            echo "::error::A model-facing git credential remains after Issue-mode Claude."
            exit 1
          fi
          echo "Issue-mode git credentials removed before trusted post-steps."

      # Existing-PR mode intentionally writes to an already-approved same-repo
      # head branch. Its PAT checkout and broader validation tools are isolated
      # after the Issue-mode model has exited and its credentials were scrubbed.
      - name: Checkout existing PR head branch
        if: steps.keycheck.outputs.has_key == 'true' && steps.pr_context.outputs.same_repo_pr == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr_context.outputs.head_sha }}
          token: ${{ secrets.AUTOMATION_PAT || github.token }}
          fetch-depth: 0

      - name: Attach checkout to original PR head branch
        if: steps.keycheck.outputs.has_key == 'true' && steps.pr_context.outputs.same_repo_pr == 'true'
        env:
          HEAD_REF: ${{ steps.pr_context.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr_context.outputs.head_sha }}
        run: |
          set -euo pipefail
          git checkout -B "${HEAD_REF}" "${HEAD_SHA}"
          git branch --set-upstream-to="origin/${HEAD_REF}" "${HEAD_REF}" 2>/dev/null || true
          current="$(git rev-parse HEAD)"
          if [ "${current}" != "${HEAD_SHA}" ]; then
            echo "::error::Checked out ${current}, expected PR head ${HEAD_SHA}."
            exit 1
          fi
          echo "Checked out original PR head branch ${HEAD_REF} at ${HEAD_SHA}."

      - name: Run Claude Code (existing PR head path)
        id: claude_pr
        if: steps.keycheck.outputs.has_key == 'true' && steps.pr_context.outputs.same_repo_pr == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_BRANCH: ${{ steps.pr_context.outputs.head_ref }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # PAT so Claude's push triggers codex-gate; default token fallback.
          github_token: ${{ secrets.AUTOMATION_PAT || github.token }}
          trigger_phrase: "@claude"
          label_trigger: "claude-fix"
          show_full_output: ${{ vars.CLAUDE_SHOW_FULL_OUTPUT == 'true' }}
          claude_args: |
            --max-turns 50
            --allowedTools "Read,Glob,Grep,Edit,Write,MultiEdit,Bash(git:*),Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(pip:*),Bash(node:*),Bash(npm:*),Bash(ls:*),Bash(cat:*),Bash(find:*),Bash(head:*),Bash(tail:*),Bash(sed:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(gh pr:*),Bash(gh issue:*),Bash(actionlint)"
          additional_permissions: |
            actions: read
          prompt: |
            You are fixing an EXISTING pull request in this repository.

            Pull request: #${{ steps.pr_context.outputs.pr_number }}
            Existing head branch: ${{ steps.pr_context.outputs.head_ref }}
            Head SHA at checkout: ${{ steps.pr_context.outputs.head_sha }}

            Work only on the currently checked-out existing PR head branch.
            Commit and push directly to that branch.
            Do NOT create a new branch.
            Do NOT open a new pull request.
            Do NOT merge the pull request yourself.

            Follow the @claude request and apply the minimal fix for the active
            review findings on this PR. Prefer the allowed tools and do NOT
            attempt tools outside the allowlist; the PR's CI (codex-gate) is the
            final validation, so do not block on running the full suite locally
            if the sandbox can't.

      - name: Delivery check — did a fix land on the head?
        id: delivery
        # fix #23: judge Claude by DELIVERY, not by the action's conclusion.
        # claude-code-action returns `success` on a 15s no-op with zero commits
        # (TRF #84), so the conclusion is meaningless. DELIVERED = at least one new
        # commit on the PR head ref since the trigger comment's timestamp. Runs
        # whenever the key is present (independent of the Claude step's outcome).
        if: always() && steps.keycheck.outputs.has_key == 'true' && !(steps.pr_context.outputs.is_pr_comment == 'true' && steps.pr_context.outputs.same_repo_pr != 'true')
        uses: actions/github-script@v8
        env:
          # fix #26: the action's SDK writes a terminal result JSON here. Prefer the
          # step output if the action declares one; else the delivery step finds it
          # under RUNNER_TEMP. Used to CLASSIFY a non-delivery (billing/error/no-op).
          EXECUTION_FILE: ${{ steps.claude_pr.outputs.execution_file || steps.claude_issue.outputs.execution_file }}
        with:
          github-token: ${{ secrets.AUTOMATION_PAT || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const comment = context.payload.comment;
            if (!comment) {
              core.info('No trigger comment (Issue/label event) — delivery check N/A, treat as delivered.');
              core.setOutput('delivered', 'true');
              return;
            }
            const since = comment.created_at;
            let pr = context.payload.pull_request;
            if (!pr && context.payload.issue && context.payload.issue.pull_request) {
              try { pr = (await github.rest.pulls.get({ owner, repo, pull_number: context.payload.issue.number })).data; }
              catch (e) { core.info(`pulls.get failed: ${e.message}`); }
            }
            if (!pr || !pr.head || !pr.head.ref) {
              core.info('No PR head resolvable — delivery check N/A, treat as delivered.');
              core.setOutput('delivered', 'true');
              return;
            }
            const sinceMs = new Date(since).getTime();
            let delivered = false;
            try {
              const commits = await github.paginate(github.rest.repos.listCommits, {
                owner, repo, sha: pr.head.ref, since, per_page: 100,
              });
              delivered = commits.some((c) => new Date(c.commit.committer.date).getTime() > sinceMs);
              core.info(`Delivery check: ${commits.length} commit(s) on ${pr.head.ref} since ${since} → delivered=${delivered}`);
            } catch (e) {
              // fail-soft: if we can't tell, do NOT falsely mark undelivered (a wrong
              // 👎). The watchdog's own delivery window still catches a real no-op.
              core.info(`listCommits failed (treat as delivered, fail-soft): ${e.message}`);
              delivered = true;
            }
            core.setOutput('delivered', delivered ? 'true' : 'false');

            // fix #26: CLASSIFY a non-delivery from the SDK terminal result. TRF #88
            // proved the action reports subtype:"success" even when the account is
            // out of credit (is_error:true, "Credit balance is too low", 0 tokens),
            // so a dead fixer looked like a mysterious no-op. Only the honest class
            // lets the watchdog skip the 20-min wait / stop proxying an empty account.
            let cls = 'no_delivery';   // default when no result file (behavior unchanged)
            let resultStr = '';
            if (!delivered) {
              const fs = require('fs');
              const cp = require('child_process');
              let file = process.env.EXECUTION_FILE;
              if (!file || !fs.existsSync(file)) {
                try {
                  const found = cp.execSync(`find "${process.env.RUNNER_TEMP}" -maxdepth 2 -name 'claude-execution-output.json' 2>/dev/null`).toString().trim().split('\n')[0];
                  if (found && fs.existsSync(found)) file = found;
                } catch (e) { /* find failed — classification skipped */ }
              }
              if (file && fs.existsSync(file)) {
                try {
                  const txt = fs.readFileSync(file, 'utf8');
                  let result = null;
                  try {
                    const j = JSON.parse(txt);
                    const arr = Array.isArray(j) ? j : [j];
                    result = arr.find((x) => x && x.type === 'result') || null;
                  } catch (e) {
                    for (const line of txt.split('\n')) { try { const o = JSON.parse(line); if (o && o.type === 'result') result = o; } catch (e2) {} }
                  }
                  const isErr = !!(result && result.is_error);
                  resultStr = String((result && result.result) || '').slice(0, 200);
                  const billing = /billing_error/.test(txt) || /Credit balance is too low/i.test(resultStr) || /Credit balance is too low/i.test(txt);
                  if (isErr && billing) cls = 'billing_error';
                  else if (isErr) cls = 'fixer_error';
                  else cls = 'no_delivery';   // ran, no error, no commit → genuine no-op
                  core.info(`SDK outcome class: ${cls} (is_error=${isErr}) result="${resultStr}" from ${file}`);
                } catch (e) { core.info(`classify failed (default no_delivery): ${e.message}`); }
              } else {
                core.info('No claude-execution-output.json found — classification skipped (default no_delivery).');
              }
            }
            core.setOutput('class', cls);
            core.setOutput('resultStr', resultStr);

      - name: Mark a no-delivery fix (👎 + ladder handoff)
        # fix #23: fire when the Claude step DID NOT SUCCEED **OR** succeeded but
        # DELIVERED NOTHING (no new commit on the head — the TRF #84 no-op-success
        # trap that the old `outcome != 'success'` guard missed). Gated on has_key
        # so a fail-soft no-key skip isn't 👎'd. Fully fail-soft: an error here must
        # NEVER fail the job.
        if: ${{ always() && steps.keycheck.outputs.has_key == 'true' && !(steps.pr_context.outputs.is_pr_comment == 'true' && steps.pr_context.outputs.same_repo_pr != 'true') && (((steps.pr_context.outputs.same_repo_pr == 'true') && steps.claude_pr.outcome != 'success') || ((steps.pr_context.outputs.is_pr_comment != 'true') && steps.claude_issue.outcome != 'success') || steps.delivery.outputs.delivered != 'true') }}
        uses: actions/github-script@v8
        env:
          # fix #26: the classified outcome from the delivery step.
          CLAUDE_CLASS: ${{ steps.delivery.outputs.class }}
          CLAUDE_RESULT: ${{ steps.delivery.outputs.resultStr }}
        with:
          github-token: ${{ secrets.AUTOMATION_PAT || github.token }}
          script: |
            try {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const comment = context.payload.comment;
              const commentId = comment && comment.id;
              // fix #26: honest failure class (billing_error / fixer_error / no_delivery).
              const cls = (process.env.CLAUDE_CLASS || 'no_delivery').trim() || 'no_delivery';
              const resultStr = (process.env.CLAUDE_RESULT || '').slice(0, 200);
              if (cls === 'billing_error' || cls === 'fixer_error') {
                core.error(`Claude fixer ${cls} — no fix delivered. result="${resultStr || '(none)'}"`);
              }
              // ADD-ONLY 👎 (fix #23): the 👀 on the trigger is placed by the hosted
              // `claude[bot]` App — a DIFFERENT identity whose reactions we cannot
              // delete (cross-identity deletion is forbidden), and our own 👀 may not
              // exist. So we NEVER "swap"; we ADD a 👎 to signal the no-delivery.
              if (commentId) {
                const isReviewComment = context.eventName === 'pull_request_review_comment';
                const createReaction = isReviewComment
                  ? github.rest.reactions.createForPullRequestReviewComment
                  : github.rest.reactions.createForIssueComment;
                try {
                  await createReaction({ owner, repo, comment_id: commentId, content: '-1' });
                  core.info(`Added 👎 on comment ${commentId} (Claude delivered no fix).`);
                } catch (e) { core.info(`add 👎 failed (ignored): ${e.message}`); }
              } else {
                core.info('No triggering comment id (Issue event) — no reaction to add.');
              }
              // UPSERT an ai-loop marker so the watchdog can advance the fixer ladder
              // WITHOUT waiting the full 20-min timeout. state=no_delivery on the head.
              let pr = context.payload.pull_request;
              if (!pr && context.payload.issue && context.payload.issue.pull_request) {
                try { pr = (await github.rest.pulls.get({ owner, repo, pull_number: context.payload.issue.number })).data; } catch (e) { core.info(`pulls.get failed: ${e.message}`); }
              }
              if (pr && pr.head) {
                const headSha = pr.head.sha;
                const prNumber = pr.number;
                let attempt = 1;
                const mm = (comment && comment.body || '').match(/ai-loop:v1[^>]*\battempt=(\d+)/);
                if (mm) attempt = parseInt(mm[1], 10);
                let exists = false;
                try {
                  const ic = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 });
                  exists = ic.some((c) => { const b = c.body || ''; return b.includes('agent=claude ') && b.includes(`state=${cls}`) && b.includes(`head=${headSha}`); });
                } catch (e) { core.info(`listComments failed (ignored): ${e.message}`); }
                if (!exists) {
                  const note = cls === 'billing_error'
                    ? 'Claude fixer hit a billing_error (Anthropic credit exhausted) — no inference ran (0 tokens). Handing off to the fixer ladder (watchdog).'
                    : cls === 'fixer_error'
                    ? `Claude fixer errored — no commit delivered ("${resultStr}"). Handing off to the fixer ladder (watchdog).`
                    : 'Claude Code ran but delivered no commit on this head — handing off to the fixer ladder (watchdog).';
                  try {
                    await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: `<!-- ai-loop:v1 root_pr=${prNumber} head=${headSha} attempt=${attempt} agent=claude state=${cls} -->\n${note}` });
                    core.info(`Posted claude/${cls} marker for PR #${prNumber} head ${headSha}.`);
                  } catch (e) { core.info(`${cls} marker failed (ignored): ${e.message}`); }
                }
              }
            } catch (e) {
              core.info(`no-delivery handling failed (ignored): ${e.message}`);
            }

      - name: Create Claude PR from trusted branch
        if: ${{ always() && steps.claude_issue.outcome != 'skipped' && steps.scrub_issue_credentials.outcome == 'success' && steps.claude_issue.outputs.branch_name != '' }}
        uses: actions/github-script@v8
        env:
          CLAUDE_BRANCH_NAME: ${{ steps.claude_issue.outputs.branch_name }}
        with:
          # PAT-authored creation wakes CI/Codex Gate. The exact branch is an
          # action output and must retain the action-controlled prefix.
          github-token: ${{ secrets.AUTOMATION_PAT || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = String(process.env.CLAUDE_BRANCH_NAME || '');
            if (!branch.startsWith('claude/')) throw new Error(`Refusing untrusted Claude branch: ${branch}`);
            const issueNum = context.payload.issue?.number;
            if (!issueNum) throw new Error('Issue number missing for Claude PR creation');
            const existing = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 100,
            });
            if (existing.length) {
              core.info(`Claude PR #${existing[0].number} already exists for ${branch}.`);
              return;
            }
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (e) {
              if (e.status === 404) { core.info(`Claude branch ${branch} was not pushed; no PR to create.`); return; }
              throw e;
            }
            const base = context.payload.repository.default_branch;
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${base}...${branch}`,
            });
            if (comparison.ahead_by < 1) { core.info(`Claude branch ${branch} has no delivered commit.`); return; }
            const title = `fix: ${String(context.payload.issue.title || `Issue #${issueNum}`).slice(0, 240)}`;
            const { data: created } = await github.rest.pulls.create({
              owner, repo, head: branch, base, title,
              body: `Fixes #${issueNum}\n\nCreated from the trusted Claude workflow branch for this Issue.`,
            });
            core.info(`Created Claude PR #${created.number} from trusted branch ${branch}.`);

      - name: Record Claude PR provenance and conditionally auto-merge
        # Provenance must survive a run that creates a PR and then fails or is
        # cancelled. `automerge` remains success-only; a failed delivery gets
        # only the durable claude-generated marker.
        if: ${{ always() && steps.claude_issue.outcome != 'skipped' && steps.scrub_issue_credentials.outcome == 'success' }}
        uses: actions/github-script@v8
        env:
          CLAUDE_BRANCH_NAME: ${{ steps.claude_issue.outputs.branch_name }}
        with:
          # Use the default token so the durable claude-generated label event is
          # attributable to github-actions[bot], independently of PAT-authored
          # PR ownership or Claude's chosen branch name.
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const delivered = '${{ steps.claude_issue.outcome }}' === 'success';
            const claudeBranch = String(process.env.CLAUDE_BRANCH_NAME || '');
            if (!claudeBranch) { core.info('Claude action reported no branch; no PR provenance to record.'); return; }
            if (!claudeBranch.startsWith('claude/')) throw new Error(`Refusing untrusted Claude branch: ${claudeBranch}`);
            const labels = [
              { name: 'claude-generated', color: '5319e7', description: 'Provenance: PR was created by the Claude automation workflow' },
              ...(delivered ? [
                { name: 'automerge', color: '0e8a16', description: 'Auto-merge by Merge Bot once green' },
              ] : []),
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

            async function label(prNumber) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNumber,
                labels: delivered ? ['claude-generated', 'automerge'] : ['claude-generated'],
              });
              core.info(`Labeled PR #${prNumber} claude-generated${delivered ? ' + automerge' : ' (delivery not successful)'}.`);
            }

            const matches = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: `${owner}:${claudeBranch}`, per_page: 100,
            });
            if (!matches.length) { core.info(`No PR exists for trusted Claude branch ${claudeBranch}.`); return; }
            for (const pr of matches) await label(pr.number);
