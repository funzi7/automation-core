name: Codex Gate

# Blocking status check `check-codex-status`.
#
# Invariant: an unresolved, non-outdated trusted Codex P1/P2 inline review
# thread blocks regardless of unrelated later commits or current-head thumbs-up.
# A finding clears only when its thread is resolved, or GitHub marks it outdated
# and Codex supplies a current-head signal with no active replacement finding,
# or the explicit `codex-p1-acknowledged` administrator label is present.
# Current-head review freshness is bound to exact `commit_id`,
# `original_commit_id`, or `Reviewed commit` evidence. Task summaries and
# timestamp-only results never count. Reaction-only clean is limited to an
# authenticated PR with one observed head. Thread state comes from GraphQL.
# The authoritative decision implementation stays inline in this trusted
# default-branch workflow. PR-controlled workflow, checkout and require paths
# are forbidden; review events are rechecked through a default-branch
# workflow_run relay. A PAT-independent scheduled sweep covers thread-state
# changes that have no supported Actions trigger. Trusted actor allowlisting,
# Summary/Testing quote stripping, trusted-sync grace and intentional technical
# fail-soft remain.
#
on:
  # SECURITY: pull_request/review/review_comment workflows execute from the
  # untrusted PR merge ref. pull_request_target executes this workflow from the
  # base default branch. No step checks out or executes PR-controlled code.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # issue_comment uses the default-branch ref and is safe here; untrusted body
  # text is never interpolated into executable script.
  issue_comment:
    types: [created, edited, deleted]
  # A pull_request_review workflow would execute from the untrusted PR merge
  # ref. Codex Auto-Fix already receives that event (including clean reviews,
  # whose job is skipped); its completed run relays here, where GitHub loads
  # this evaluator from the default branch. This path uses GITHUB_TOKEN only,
  # so clean reviews are rechecked even when AUTOMATION_PAT is unavailable.
  workflow_run:
    workflows: ['Codex Auto-Fix']
    types: [completed]
  # GitHub Actions has no pull_request_review_thread trigger. Sweep open PRs
  # from this trusted default-branch workflow so resolved/reopened thread state
  # is reflected on the exact head even when AUTOMATION_PAT is unavailable.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check (used by the watchdog sweep + manual re-check)'
        required: false
        type: string

# Keep one evaluator run alive to completion; event bursts may queue one newer
# review-thread-aware evaluation, but never cancel a half-published PR-head
# verdict. Each run creates a fresh completed `check-codex-status` check on the
# exact PR head; no cross-run check update is attempted.
concurrency:
  # The scheduled sweep can cover several PRs in one run, so serialize every
  # evaluator in the repository. This prevents event-driven and scheduled
  # snapshots from publishing exact-head verdicts in stale completion order.
  group: codex-gate-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  # The trusted default-branch evaluator records each new PR-head epoch in an
  # authenticated github-actions[bot] marker comment.
  issues: write
  # Markerless legacy PRs bootstrap from the current contiguous pull_request-run
  # SHA epoch as a server-observed transition floor.
  actions: read
  # fix #11: publish the explicit `check-codex-status` check-run with output text.
  checks: write

jobs:
  # pull_request_target and default-branch dispatch runs attach their native job
  # check to the trusted workflow ref, not necessarily to the PR head. Therefore
  # the authoritative required check is the create-only `check-codex-status`
  # check published explicitly against pr.head.sha below. The evaluator job has
  # a distinct name so branch protection and merge automation cannot confuse it
  # with the PR-head verdict.
  codex-gate:
    name: codex-gate-evaluator
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number(s) to check
        id: prs
        uses: actions/github-script@v8
        with:
          script: |
            // pull_request_target → the PR being opened/synced, with this
            //   workflow loaded from the trusted base/default branch
            // issue_comment → context.payload.issue (PRs are issues for
            //   the comments API; workflow ref is the default branch)
            // workflow_run → trusted default-branch relay for Codex review
            //   activity; workflow_dispatch → no PR payload at all,
            //   the PR number comes through as an input; parse it back
            //   into a JS number so downstream filters compare correctly.
            let prNumbers = [];

            if (context.payload.pull_request) {
              prNumbers = [context.payload.pull_request.number];
            } else if (context.payload.issue?.pull_request) {
              prNumbers = [context.payload.issue.number];
            } else if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run || {};
              prNumbers = [...new Set(
                (run.pull_requests || [])
                  .map((pull) => Number(pull.number))
                  .filter(Number.isFinite),
              )];
              // GitHub can omit workflow_run.pull_requests for some event
              // shapes. Resolve against the run SHA without trusting a branch
              // name supplied by PR code.
              if (!prNumbers.length && run.head_sha) {
                const associated = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  { owner: context.repo.owner, repo: context.repo.repo, commit_sha: run.head_sha, per_page: 100 },
                );
                prNumbers = [...new Set(
                  associated
                    .filter((pull) => pull.state === 'open' && pull.base?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`)
                    .map((pull) => Number(pull.number))
                    .filter(Number.isFinite),
                  )];
              }
            } else if (context.eventName === 'schedule') {
              const open = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', per_page: 100,
              });
              prNumbers = open.map((pull) => pull.number);
            } else if (
              context.eventName === 'workflow_dispatch' &&
              context.payload.inputs?.pr_number
            ) {
              prNumbers = [parseInt(context.payload.inputs.pr_number, 10)];
            }

            core.setOutput('numbers', JSON.stringify(prNumbers));

      - name: Evaluate Codex P1 status for each PR
        if: steps.prs.outputs.numbers != '[]'
        uses: actions/github-script@v8
        env:
          PR_NUMBERS_JSON: ${{ steps.prs.outputs.numbers }}
          # Requirement 1: Claude fallback review evidence is honoured only
          # where repository policy explicitly opts in.
          CLAUDE_FALLBACK_REVIEW_ENABLED: ${{ vars.CLAUDE_FALLBACK_REVIEW_ENABLED }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumbers = JSON.parse(process.env.PR_NUMBERS_JSON || '[]');

            // fix #21: trusted-sync grace-green. A sync PR is a byte-copy of an
            // upstream automation-core main that already passed our full validation;
            // Codex engages on syncs inconsistently and SILENCE is not a finding, so
            // a trusted sync with zero Codex signals auto-clears after a grace window.
            const SYNC_GRACE_MINUTES = 30;
            // Trusted-sync predicate — must match merge-bot.yml / codex-gate.yml — keep in sync.
            const SYNC_TITLE_PREFIX = 'chore(automation): sync from automation-core';
            const SYNC_BRANCH = 'chore/sync-automation-core';   // branch the sync workflow opens
            const OWNER_LOGIN = 'funzi7';
            const isTrustedSync = (pr) => {
              const titleIsSync = (pr.title || '').startsWith(SYNC_TITLE_PREFIX);
              const sameRepo = !!(pr.head && pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`);
              return titleIsSync && (
                (pr.user && pr.user.login === OWNER_LOGIN) ||
                ((pr.head && pr.head.ref === SYNC_BRANCH) && sameRepo)
              );
            };

            // Strict Codex actor allowlist — must match claude-fallback-watchdog.yml — keep in sync.
            // Exact GitHub App identities: GraphQL reviewThreads omit
            // the REST-style [bot] suffix.
            const TRUSTED_CODEX_LOGINS = new Set([
              'chatgpt-codex-connector',
              'chatgpt-codex-connector[bot]',
            ]);
            const isCodex = (user) => !!user?.login && TRUSTED_CODEX_LOGINS.has(user.login);

            // SECURITY: authoritative policy stays inline in this workflow.
            // Never checkout/require executable gate code from the PR merge
            // ref. tools/codex_gate_logic.js mirrors this pure logic for CI.
            const P1_PATTERN = /(?:P1-orange|(?:^|\n)[\s>*\-_#`]*(?:\*\*\s*P1\s*\*\*|\[P1\]|P1:))/i;
            const P2_PATTERN = /(?:P2-yellow|(?:^|\n)[\s>*\-_#`]*(?:\*\*\s*P2\s*\*\*|\[P2\]|P2:))/i;

            function stripSummarySections(body) {
              if (!body) return '';
              return String(body)
                .replace(/(?:^|\n)#{2,3}\s+Summary[\s\S]*?(?=\n#{2,3}\s|\n---|$)/gi, '')
                .replace(/(?:^|\n)#{2,3}\s+Testing[\s\S]*?(?=\n#{2,3}\s|\n---|$)/gi, '');
            }

            function severity(body) {
              const semantic = stripSummarySections(body);
              if (P1_PATTERN.test(semantic)) return 'P1';
              if (P2_PATTERN.test(semantic)) return 'P2';
              return null;
            }

            const REVIEWED_COMMIT_PATTERN = /(?:^|\n)\*\*Reviewed commit:\*\*\s*`([a-f0-9]{10,40})`(?:\s|$)/i;

            function isCodexCapacityNotice(body) {
              const text = String(body || '').trim();
              return /^You have reached your Codex usage limits for code reviews\./i.test(text) ||
                /^Codex (?:is|was) (?:currently )?(?:at capacity|unable to (?:complete|perform) (?:this )?code review)/i.test(text);
            }
            function isCodexTaskResult(body) {
              const text = String(body || '');
              return /(?:^|\n)#{2,3}\s+Summary(?:\s|$)/i.test(text) &&
                /\[View task(?:\s*(?:→|->))?\s*\]\(/i.test(text);
            }
            const HEAD_EPOCH_MARKER_PATTERN = /<!--\s*codex-head-epoch:v3\s+run=(\d+)\s+attempt=(\d+)\s+pr=(\d+)\s+head=([a-f0-9]{40})\s*-->/i;
            function signalTargetsHead(item, headSha, headObservedAt, dateField = 'created_at') {
              const exactHead = String(headSha || '').toLowerCase();
              if (!/^[a-f0-9]{40}$/.test(exactHead)) return false;
              if (isCodexTaskResult(item?.body)) return false;
              const originalCommit = String(item?.original_commit_id || '').toLowerCase();
              if (originalCommit) return originalCommit === exactHead;
              const commit = String(item?.commit_id || '').toLowerCase();
              if (commit) return commit === exactHead;
              const marker = String(item?.body || '').match(REVIEWED_COMMIT_PATTERN)?.[1]?.toLowerCase();
              if (marker) return exactHead.startsWith(marker);
              // A delayed old-head task may finish after a new push. Timing
              // alone is never an exact-head review binding.
              return false;
            }

            let prWorkflowRunsPromise = null;
            function allPrWorkflowRuns() {
              if (!prWorkflowRunsPromise) {
                prWorkflowRunsPromise = github.paginate(
                  github.rest.actions.listWorkflowRunsForRepo,
                  { owner, repo, event: 'pull_request', per_page: 100 },
                );
              }
              return prWorkflowRunsPromise;
            }

            const epochRunCache = new Map();
            const MAX_EPOCH_MARKER_CANDIDATES = 16;
            async function trustedHeadMarkers(comments, prNumber) {
              const refsByRun = new Map();
              for (const comment of comments || []) {
                if ((comment.user?.login || '') !== 'github-actions[bot]') continue;
                const match = String(comment.body || '').match(HEAD_EPOCH_MARKER_PATTERN);
                if (!match || Number(match[3]) !== Number(prNumber)) continue;
                const ref = {
                  runId: Number(match[1]), attempt: Number(match[2]),
                  markerPr: Number(match[3]), markerHead: match[4].toLowerCase(),
                  commentAt: new Date(comment.created_at || 0).getTime(),
                  commentId: Number(comment.id || 0),
                };
                const previous = refsByRun.get(ref.runId);
                if (!previous || ref.commentAt > previous.commentAt ||
                    (ref.commentAt === previous.commentAt && ref.commentId > previous.commentId)) {
                  refsByRun.set(ref.runId, ref);
                }
              }
              // Run IDs are used only to bound the newest candidate suffix;
              // authenticated run.created_at remains authoritative for epochs.
              // Truncation is fail-closed: it can require a newer review, never
              // revive evidence from an older head epoch.
              const candidates = [...refsByRun.values()]
                .sort((a, b) => b.runId - a.runId)
                .slice(0, MAX_EPOCH_MARKER_CANDIDATES);
              if (refsByRun.size > candidates.length) {
                core.info(`PR #${prNumber}: bounded epoch verification to ${candidates.length} newest run candidates.`);
              }
              const markers = [];
              for (const { runId, attempt, markerHead, commentAt } of candidates) {
                const key = `${runId}/${attempt}`;
                if (!epochRunCache.has(key)) {
                  epochRunCache.set(key, github.request(
                    'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}',
                    { owner, repo, run_id: runId, attempt_number: attempt },
                  ).then(({ data }) => data));
                }
                try {
                  const run = await epochRunCache.get(key);
                  const belongsToPr = (run.pull_requests || [])
                    .some((pull) => Number(pull.number) === Number(prNumber));
                  const startedAt = new Date(run.run_started_at || run.created_at || 0).getTime();
                  const finishedAt = new Date(run.updated_at || 0).getTime();
                  const commentInsideRun = Number.isFinite(commentAt) &&
                    commentAt >= startedAt - 5000 && (
                      run.status !== 'completed' || commentAt <= finishedAt + 5000
                    );
                  if (
                    run.path !== '.github/workflows/codex-gate.yml' ||
                    run.event !== 'pull_request_target' ||
                    Number(run.run_attempt) !== attempt || !belongsToPr || !commentInsideRun
                  ) continue;
                  const observedAt = new Date(run.created_at || 0).getTime();
                  // pull_request_target run.head_sha is the trusted base SHA,
                  // not the PR head. The marker head was written from the
                  // triggering payload inside this authenticated Gate attempt.
                  const head = markerHead;
                  if (/^[a-f0-9]{40}$/.test(head) && Number.isFinite(observedAt) && observedAt > 0) {
                    markers.push({ head, observedAt, id: Number(run.id || runId) });
                  }
                } catch (e) {
                  core.warning(`PR #${prNumber}: epoch run ${runId} verification failed: ${e.message}`);
                }
              }
              // A rerun of an old attempt creates a new comment, but does not
              // create a new head epoch. Establish order only after each marker
              // is authenticated, using the immutable run creation time.
              return markers.sort((a, b) =>
                b.observedAt - a.observedAt || b.id - a.id);
            }

            async function onlyObservedHead(prNumber, headSha, comments) {
              try {
                const exactHead = String(headSha || '').toLowerCase();
                const rawHeads = (comments || [])
                  .filter((comment) => (comment.user?.login || '') === 'github-actions[bot]')
                  .map((comment) => String(comment.body || '').match(HEAD_EPOCH_MARKER_PATTERN))
                  .filter((match) => match && Number(match[3]) === Number(prNumber))
                  .map((match) => String(match[4]).toLowerCase());
                if (!rawHeads.length || rawHeads.some((head) => head !== exactHead)) return false;
                const runs = await allPrWorkflowRuns();
                if ((runs || []).some((run) =>
                  (run.pull_requests || []).some((pull) => Number(pull.number) === Number(prNumber)) &&
                  String(run.head_sha || '').toLowerCase() !== exactHead
                )) return false;
                const verified = await trustedHeadMarkers(comments, prNumber);
                return verified.some((marker) => marker.head === exactHead);
              } catch (e) {
                core.warning(`PR #${prNumber}: reaction head-history lookup failed; reaction stays non-binding: ${e.message}`);
                return false;
              }
            }

            function reactionTargetsOnlyObservedHead(reaction, headObservedAt, isOnlyHead) {
              if (!isOnlyHead || reaction?.content !== '+1') return false;
              const reactionAt = new Date(reaction?.created_at || 0).getTime();
              const observedAt = new Date(headObservedAt || 0).getTime();
              return Number.isFinite(reactionAt) && Number.isFinite(observedAt) &&
                observedAt > 0 && reactionAt > observedAt;
            }

            function currentHeadEpochFromTimeline(timeline, headSha) {
              return currentHeadEpochEvidenceFromTimeline(timeline, headSha).epoch;
            }

            function currentHeadEpochEvidenceFromTimeline(timeline, headSha) {
              const exactHead = String(headSha || '').toLowerCase();
              if (!timeline.length || timeline[0].head !== exactHead) {
                return { epoch: null, hasBoundary: false };
              }
              const epoch = [];
              for (const item of timeline) {
                if (item.head !== exactHead) {
                  return {
                    epoch: epoch.length ? new Date(Math.min(...epoch)) : null,
                    hasBoundary: true,
                  };
                }
                epoch.push(item.observedAt);
              }
              return {
                epoch: epoch.length ? new Date(Math.min(...epoch)) : null,
                hasBoundary: false,
              };
            }

            function prRunTimeline(runs, prNumber) {
              return (runs || [])
                .filter((run) =>
                  (run.pull_requests || []).some((candidate) => candidate.number === prNumber))
                .map((run) => ({
                  head: String(run.head_sha || '').toLowerCase(),
                  observedAt: new Date(run.created_at || 0).getTime(),
                }))
                .filter((run) => /^[a-f0-9]{40}$/.test(run.head) && Number.isFinite(run.observedAt) && run.observedAt > 0)
                .sort((a, b) => a.observedAt - b.observedAt);
            }

            function currentHeadEpochEvidenceFromRuns(runs, prNumber, headSha) {
              const timeline = prRunTimeline(runs, prNumber).reverse();
              return currentHeadEpochEvidenceFromTimeline(timeline, headSha);
            }

            async function ensureHeadEpochMarker(prNumber, comments) {
              if (
                context.eventName !== 'pull_request_target' ||
                Number(context.payload.pull_request?.number) !== Number(prNumber) ||
                !new Set(['opened', 'synchronize', 'reopened']).has(context.payload.action)
              ) return comments;
              // Runs may queue behind repository-wide concurrency while the PR
              // moves again. Authenticate the immutable triggering payload head,
              // never the freshly re-fetched live PR head.
              const markerHead = String(
                context.payload.pull_request?.head?.sha || '',
              ).toLowerCase();
              if (!/^[a-f0-9]{40}$/.test(markerHead)) {
                core.warning(`PR #${prNumber}: triggering payload head unavailable; epoch marker skipped.`);
                return comments;
              }
              const runId = Number(context.runId);
              const attempt = Number(process.env.GITHUB_RUN_ATTEMPT || 1);
              const alreadyRecorded = (comments || []).some((comment) => {
                if ((comment.user?.login || '') !== 'github-actions[bot]') return false;
                const match = String(comment.body || '').match(HEAD_EPOCH_MARKER_PATTERN);
                return match && Number(match[1]) === runId && Number(match[2]) === attempt &&
                  Number(match[3]) === Number(prNumber) &&
                  String(match[4]).toLowerCase() === markerHead;
              });
              if (alreadyRecorded) return comments;
              const { data: marker } = await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `<!-- codex-head-epoch:v3 run=${runId} attempt=${attempt} pr=${prNumber} head=${markerHead} -->`,
              });
              core.info(`PR #${prNumber}: indexed trusted head epoch run ${runId}/${attempt}`);
              return [...comments, marker];
            }

            async function triggeringHeadEventIsCurrent(prNumber, liveHead) {
              if (
                context.eventName !== 'pull_request_target' ||
                Number(context.payload.pull_request?.number) !== Number(prNumber) ||
                !new Set(['opened', 'synchronize', 'reopened']).has(context.payload.action)
              ) return true;
              const payloadHead = String(
                context.payload.pull_request?.head?.sha || '',
              ).toLowerCase();
              if (!/^[a-f0-9]{40}$/.test(payloadHead) || payloadHead !== liveHead.toLowerCase()) {
                return false;
              }
              // Repository-wide concurrency can leave an old A event queued
              // until after A -> B -> A. Payload/live SHA equality alone cannot
              // distinguish that old A event. A force-push transition newer than
              // this immutable workflow run proves the queued payload is stale.
              // Treat equal-second timestamps as stale too: neither REST timestamp
              // has enough precision to prove the transition preceded this run.
              try {
                const [{ data: thisRun }, events] = await Promise.all([
                  github.rest.actions.getWorkflowRun({
                    owner, repo, run_id: Number(context.runId),
                  }),
                  github.paginate(
                    'GET /repos/{owner}/{repo}/issues/{issue_number}/events',
                    { owner, repo, issue_number: prNumber, per_page: 100 },
                  ),
                ]);
                const runCreatedAt = new Date(thisRun.created_at || 0).getTime();
                const newestForcePushAt = Math.max(0, ...(events || [])
                  .filter((event) => event.event === 'head_ref_force_pushed')
                  .map((event) => new Date(event.created_at || 0).getTime())
                  .filter((time) => Number.isFinite(time)));
                return Number.isFinite(runCreatedAt) && runCreatedAt > 0 &&
                  newestForcePushAt < runCreatedAt;
              } catch (e) {
                core.warning(`PR #${prNumber}: queued head-event freshness lookup failed; skipping fail-closed: ${e.message}`);
                return false;
              }
            }

            async function observedHeadTransition(prNumber, headSha, comments = []) {
              const [markers, runs] = await Promise.all([
                trustedHeadMarkers(comments, prNumber),
                allPrWorkflowRuns(),
              ]);
              const markerEpoch = currentHeadEpochFromTimeline(markers, headSha);
              const runEvidence = currentHeadEpochEvidenceFromRuns(runs, prNumber, headSha);
              const runEpoch = runEvidence.epoch;
              // Authenticated markers retain the complete contiguous epoch. The
              // bounded run list may advance it only when it proves an
              // intervening different head that a failed marker write missed.
              if (markerEpoch && runEpoch && runEvidence.hasBoundary) {
                return new Date(Math.max(markerEpoch.getTime(), runEpoch.getTime()));
              }
              return markerEpoch || runEpoch;
            }

            function authorLogin(comment) {
              return String(
                comment?.author?.login ||
                comment?.user?.login ||
                comment?.authorLogin ||
                ''
              );
            }

            function findingFromThread(thread) {
              for (const comment of thread?.comments || []) {
                if (!TRUSTED_CODEX_LOGINS.has(authorLogin(comment))) continue;
                const level = severity(comment?.body || '');
                if (!level) continue;
                return {
                  severity: level,
                  path: String(thread?.path || ''),
                  line: Number.isInteger(thread?.line) ? thread.line : null,
                  startLine: Number.isInteger(thread?.startLine)
                    ? thread.startLine
                    : null,
                  threadId: String(thread?.id || ''),
                };
              }
              return null;
            }

            function classifyThreads(threads) {
              const active = [];
              const outdated = [];
              const resolved = [];
              for (const thread of threads || []) {
                const finding = findingFromThread(thread);
                if (!finding) continue;
                if (thread?.isResolved === true) resolved.push(finding);
                else if (thread?.isOutdated === true) outdated.push(finding);
                else active.push(finding);
              }
              return { active, outdated, resolved };
            }

            function decideCodexGate({
              threads = [],
              nonInlineFindings = [],
              currentHeadSignal = false,
              override = false,
              technicalError = false,
            } = {}) {
              if (override) {
                return {
                  status: 'clear',
                  reason: 'administrator_override',
                  activeFindings: [],
                };
              }
              if (technicalError) {
                return {
                  status: 'clear',
                  reason: 'technical_fail_soft',
                  activeFindings: [],
                };
              }
              if (nonInlineFindings.length) {
                return {
                  status: 'blocked',
                  reason: 'active_current_head_non_inline_finding',
                  activeFindings: nonInlineFindings,
                };
              }
              const classified = classifyThreads(threads);
              if (classified.active.length) {
                return {
                  status: 'blocked',
                  reason: 'active_unresolved_review_thread',
                  activeFindings: classified.active,
                  outdatedFindings: classified.outdated,
                };
              }
              if (classified.outdated.length && !currentHeadSignal) {
                return {
                  status: 'pending',
                  reason: 'outdated_finding_needs_current_head_signal',
                  activeFindings: [],
                  outdatedFindings: classified.outdated,
                };
              }
              if (currentHeadSignal) {
                return {
                  status: 'clear',
                  reason: classified.outdated.length
                    ? 'outdated_findings_and_current_head_signal'
                    : 'current_head_signal_no_active_findings',
                  activeFindings: [],
                  outdatedFindings: classified.outdated,
                };
              }
              // Resolution removes a finding; it is not permanent review
              // approval for unrelated commits pushed afterward.
              return {
                status: 'pending',
                reason: 'current_head_review_pending',
                activeFindings: [],
              };
            }

            // ===== CANONICAL EXACT-HEAD REVIEW EVIDENCE ======================
            // Shared VERBATIM by codex-gate.yml, merge-bot.yml and
            // claude-fallback-watchdog.yml, and mirrored by
            // tools/review_evidence.js. tests/test_review_evidence.js asserts
            // the three inline copies stay byte-identical, so Gate, Merge Bot
            // and the watchdog can never drift into three different rules.
            //
            //   valid exact-head review evidence ==
            //     normal Codex evidence
            //     OR approved Claude fallback evidence when Codex is provably
            //     unavailable
            //
            // Every rule fails closed:
            //  - an attestation is ONE atomic marker written by the trusted
            //    automation identity, minted by the canonical producer
            //    workflow, and re-authenticated here against that run through
            //    the Actions API; free-form prose is never authority;
            //  - it binds to the exact 40-character head, so any new commit
            //    invalidates it and a previous-head attestation is worthless;
            //  - the trusted Codex code-review quota notice must belong to the
            //    CURRENT head epoch and still sit inside the episode TTL;
            //  - a genuine Codex result on this head ends the episode, and
            //    normal Codex evidence remains the default authority;
            //  - an attestation that declares unresolved P1/P2 blocks rather
            //    than clears;
            //  - any lookup failure produces no evidence at all.
            //
            // This is NOT an acknowledgement mechanism: it never substitutes
            // for codex-p1-acknowledged, an owner override, or a reaction.
            const FALLBACK_PROVIDER = 'claude_code_fallback';
            const FALLBACK_REASON = 'codex_quota_unavailable';
            const FALLBACK_VERDICT = 'clean';
            const FALLBACK_ATTESTATION_WORKFLOW_PATH =
              '.github/workflows/claude-fallback-review.yml';
            const FALLBACK_ATTESTATION_AUTHOR = 'github-actions[bot]';
            const CLAUDE_FALLBACK_MARKER_PATTERN =
              /<!--\s*claude-fallback-review:v1\b([^>]*)-->/gi;
            // validation is `<status>/<reference>`, and only a PASSED status
            // can carry evidence — a failed or unknown validation must never
            // mint a clean attestation.
            const FALLBACK_VALIDATION_PATTERN = /^passed\/[A-Za-z0-9._:#=,;+()-]{1,180}$/;
            // Route B bound: a decline from an earlier head epoch authorizes a
            // fallback only this long, so stale evidence cannot authorize a
            // later unrelated fallback forever.
            const QUOTA_EPISODE_TTL_MS = 24 * 60 * 60 * 1000;
            const MAX_FALLBACK_ATTESTATION_CANDIDATES = 8;

            // Self-contained trusted-Codex predicates. They deliberately do
            // not reuse each workflow's ambient copies: the inputs to the
            // canonical decision must be built identically in all three, or
            // byte-identical logic can still reach different verdicts.
            const EVIDENCE_CODEX_LOGINS = new Set([
              'chatgpt-codex-connector',
              'chatgpt-codex-connector[bot]',
            ]);
            const EVIDENCE_P1 = /(?:P1-orange|(?:^|\n)[\s>*\-_#`]*(?:\*\*\s*P1\s*\*\*|\[P1\]|P1:))/i;
            const EVIDENCE_P2 = /(?:P2-yellow|(?:^|\n)[\s>*\-_#`]*(?:\*\*\s*P2\s*\*\*|\[P2\]|P2:))/i;
            const evidenceIsCodex = (item) => EVIDENCE_CODEX_LOGINS.has(
              String(item?.user?.login || item?.author?.login || ''),
            );
            function evidenceIsCapacityNotice(body) {
              const text = String(body || '').trim();
              return /^You have reached your Codex usage limits for code reviews\./i.test(text) ||
                /^Codex (?:is|was) (?:currently )?(?:at capacity|unable to (?:complete|perform) (?:this )?code review)/i.test(text);
            }
            function evidenceIsTaskResult(body) {
              const text = String(body || '');
              return /(?:^|\n)#{2,3}\s+Summary(?:\s|$)/i.test(text) &&
                /\[View task(?:\s*(?:→|->))?\s*\]\(/i.test(text);
            }
            function evidenceHasSeverity(body) {
              const semantic = String(body || '')
                .replace(/(?:^|\n)#{2,3}\s+Summary[\s\S]*?(?=\n#{2,3}\s|\n---|$)/gi, '')
                .replace(/(?:^|\n)#{2,3}\s+Testing[\s\S]*?(?=\n#{2,3}\s|\n---|$)/gi, '');
              return EVIDENCE_P1.test(semantic) || EVIDENCE_P2.test(semantic);
            }

            // Build the canonical inputs from the raw Codex surfaces. Every
            // consumer MUST use this, so Gate, Merge Bot and the watchdog see
            // the same quota episode from the same evidence.
            function collectReviewEvidenceInputs(sources) {
              const all = [
                ...((sources && sources.reviews) || []),
                ...((sources && sources.comments) || []),
                ...((sources && sources.reviewComments) || []),
                ...((sources && sources.reactions) || []),
              ].filter(evidenceIsCodex);
              return {
                // A notice that also carries a P1/P2 is a finding, not proof of
                // unavailability, and must never open an episode.
                quotaNotices: all.filter((item) =>
                  evidenceIsCapacityNotice(item?.body) && !evidenceHasSeverity(item?.body)),
                // Everything else Codex actually produced. A reaction has no
                // body and still counts: it proves Codex is answering. A notice
                // that carries a P1/P2 counts here too — it is not proof of
                // unavailability, so it must at least close the episode rather
                // than vanish from both lists.
                realActivity: all.filter((item) =>
                  (!evidenceIsCapacityNotice(item?.body) || evidenceHasSeverity(item?.body)) &&
                  !evidenceIsTaskResult(item?.body)),
              };
            }

            function parseFallbackAttestations(body) {
              const found = [];
              const pattern = new RegExp(
                CLAUDE_FALLBACK_MARKER_PATTERN.source,
                CLAUDE_FALLBACK_MARKER_PATTERN.flags,
              );
              let match;
              while ((match = pattern.exec(String(body || ''))) !== null) {
                const parsed = {};
                for (const part of String(match[1] || '').trim().split(/\s+/)) {
                  if (!part) continue;
                  const equals = part.indexOf('=');
                  if (equals > 0) parsed[part.slice(0, equals)] = part.slice(equals + 1);
                }
                found.push(parsed);
              }
              return found;
            }

            function fallbackCount(value) {
              if (!/^\d{1,9}$/.test(String(value ?? ''))) return null;
              return Number(value);
            }

            function evaluateFallbackAttestation(attestation, headSha) {
              const exactHead = String(headSha || '').toLowerCase();
              if (!/^[a-f0-9]{40}$/.test(exactHead)) {
                return { accepted: false, blocking: false, reason: 'unknown_head' };
              }
              if (!attestation) {
                return { accepted: false, blocking: false, reason: 'no_attestation' };
              }
              if (String(attestation.provider || '') !== FALLBACK_PROVIDER) {
                return { accepted: false, blocking: false, reason: 'wrong_provider' };
              }
              const reviewedHead = String(attestation.reviewed_head || '').toLowerCase();
              if (!/^[a-f0-9]{40}$/.test(reviewedHead)) {
                return { accepted: false, blocking: false, reason: 'malformed_reviewed_head' };
              }
              if (reviewedHead !== exactHead) {
                return { accepted: false, blocking: false, reason: 'reviewed_head_mismatch' };
              }
              if (String(attestation.reason || '') !== FALLBACK_REASON) {
                return { accepted: false, blocking: false, reason: 'wrong_reason' };
              }
              const found = fallbackCount(attestation.findings_found);
              const fixed = fallbackCount(attestation.findings_fixed);
              const unresolvedP1 = fallbackCount(attestation.unresolved_p1);
              const unresolvedP2 = fallbackCount(attestation.unresolved_p2);
              if (found === null || fixed === null ||
                  unresolvedP1 === null || unresolvedP2 === null || fixed > found) {
                return { accepted: false, blocking: false, reason: 'malformed_counts' };
              }
              const validation = String(attestation.validation || '');
              if (!FALLBACK_VALIDATION_PATTERN.test(validation)) {
                return { accepted: false, blocking: false, reason: 'missing_validation' };
              }
              if (unresolvedP1 > 0 || unresolvedP2 > 0) {
                return {
                  accepted: false,
                  blocking: true,
                  reason: 'unresolved_fallback_finding',
                  severity: unresolvedP1 > 0 ? 'P1' : 'P2',
                };
              }
              if (String(attestation.verdict || '') !== FALLBACK_VERDICT) {
                return { accepted: false, blocking: false, reason: 'verdict_not_clean' };
              }
              return {
                accepted: true,
                blocking: false,
                reason: 'structured_fallback_clean',
                findingsFound: found,
                findingsFixed: fixed,
                validation,
              };
            }

            // Is a trusted Codex code-review quota episode open right now?
            //
            // `notices` are trusted-actor capacity notices; `realActivity` is
            // every OTHER trusted Codex surface (reviews, comments, review
            // comments, reactions) excluding non-binding task summaries.
            // Ordinary comments can never reach either list.
            //
            // Two ways an episode is current, both bound to real evidence:
            //   Route A — Codex declined on THIS head epoch. The head has not
            //     moved and Codex has not returned, so the decline still
            //     describes the present state.
            //   Route B — the decline predates this head epoch, but Codex has
            //     posted nothing since and the fallback review happened within
            //     QUOTA_EPISODE_TTL_MS of it. Codex simply stops answering on
            //     later pushes while its quota is out, so requiring a fresh
            //     per-head notice would reject genuine exhaustion; the TTL plus
            //     the closure rule keep it from authorizing anything forever.
            // Any real Codex activity newer than the newest notice CLOSES the
            // episode: Codex is demonstrably answering again.
            function evaluateQuotaEpisode(notices, options) {
              const settings = options || {};
              const itemAt = (item) => new Date(
                item?.created_at || item?.submitted_at || item?.at || 0,
              ).getTime();
              const newestOf = (items) => {
                let newest = null;
                for (const item of items || []) {
                  const at = itemAt(item);
                  if (!Number.isFinite(at) || at <= 0) continue;
                  if (newest === null || at > newest) newest = at;
                }
                return newest;
              };
              if (settings.codexSignalOnHead) {
                return { active: false, reason: 'codex_available_on_head', noticeAt: null };
              }
              const newestNotice = newestOf(notices);
              if (newestNotice === null) {
                return { active: false, reason: 'no_quota_notice', noticeAt: null };
              }
              const newestReal = newestOf(settings.realActivity);
              if (newestReal !== null && newestReal > newestNotice) {
                return {
                  active: false, reason: 'quota_episode_closed',
                  noticeAt: new Date(newestNotice),
                };
              }
              const observedAt = new Date(settings.headObservedAt || 0).getTime();
              if (!Number.isFinite(observedAt) || observedAt <= 0) {
                return { active: false, reason: 'head_epoch_unknown', noticeAt: null };
              }
              if (newestNotice >= observedAt) {
                return {
                  active: true, reason: 'trusted_quota_episode',
                  noticeAt: new Date(newestNotice),
                };
              }
              const attestedAt = Number(settings.attestedAt);
              if (
                Number.isFinite(attestedAt) && attestedAt >= newestNotice &&
                attestedAt - newestNotice <= QUOTA_EPISODE_TTL_MS
              ) {
                return {
                  active: true, reason: 'trusted_quota_episode',
                  noticeAt: new Date(newestNotice),
                };
              }
              return {
                active: false, reason: 'stale_quota_evidence',
                noticeAt: new Date(newestNotice),
              };
            }

            // Provenance must never credit Codex for a Claude review.
            function reviewEvidenceProvenance(authority) {
              if (authority === 'codex') return 'Codex exact-head review accepted';
              if (authority === FALLBACK_PROVIDER) {
                return 'Claude Code fallback review accepted for exact head; Codex quota unavailable';
              }
              return 'No accepted exact-head review evidence';
            }

            function attestationRunIsTrusted(run, attempt, commentAt, defaultBranch) {
              if (!run) return false;
              // Only the canonical producer workflow may mint evidence, and
              // only when it ran from the trusted default branch through an
              // explicit dispatch (which requires write access). A run started
              // from a PR ref would execute PR-controlled YAML, so an unknown
              // default branch fails closed rather than skipping the check.
              if (String(run.path || '') !== FALLBACK_ATTESTATION_WORKFLOW_PATH) return false;
              if (String(run.event || '') !== 'workflow_dispatch') return false;
              if (!defaultBranch) return false;
              if (String(run.head_branch || '') !== String(defaultBranch)) return false;
              if (Number(run.run_attempt) !== Number(attempt)) return false;
              // A run that refused to attest, or has not finished, proves
              // nothing. The producer posts its comment and then completes
              // successfully, so requiring that costs nothing and closes the
              // open-ended window a queued or failed run would otherwise leave.
              if (String(run.status || '') !== 'completed') return false;
              if (String(run.conclusion || '') !== 'success') return false;
              const startedAt = new Date(run.run_started_at || run.created_at || 0).getTime();
              const finishedAt = new Date(run.updated_at || 0).getTime();
              const at = Number(commentAt);
              if (!Number.isFinite(at) || !Number.isFinite(startedAt) || startedAt <= 0) return false;
              if (!Number.isFinite(finishedAt) || finishedAt <= 0) return false;
              if (at < startedAt - 5000) return false;
              if (at > finishedAt + 5000) return false;
              return true;
            }

            // The single canonical question every consumer asks. Returns
            // { accepted, blocking, severity, reason, episodeReason }. It must
            // never throw: an exception escaping here would reach the Gate's
            // technical fail-soft branch, which publishes GREEN. Absence of
            // evidence must look like absence of evidence, not like success.
            async function acceptedFallbackEvidence(options) {
              try {
                return await acceptedFallbackEvidenceUnsafe(options);
              } catch (e) {
                core.warning(
                  `Claude fallback review evidence lookup failed; treating it as no evidence: ${e.message}`,
                );
                return {
                  accepted: false, blocking: false, severity: null,
                  reason: 'fallback_lookup_failed',
                  episodeReason: 'fallback_lookup_failed',
                };
              }
            }

            async function acceptedFallbackEvidenceUnsafe(options) {
              const settings = options || {};
              const prNumber = Number(settings.prNumber);
              const headSha = String(settings.headSha || '').toLowerCase();
              const none = (reason) => ({
                accepted: false, blocking: false, severity: null, reason,
                episodeReason: reason,
              });
              // Requirement 1: only when repository policy explicitly allows it.
              if (String(process.env.CLAUDE_FALLBACK_REVIEW_ENABLED || '') !== 'true') {
                return none('fallback_policy_disabled');
              }
              if (!/^[a-f0-9]{40}$/.test(headSha)) return none('unknown_head');
              // Requirement 7/12: genuine Codex evidence on this head is the
              // authority; the quota episode is over.
              if (settings.codexSignalOnHead) return none('codex_available_on_head');
              // Requirement 5/7: an OUTDATED thread that nobody resolved still
              // holds a live Codex P1/P2. On the normal path a clean Codex
              // signal clears it because Codex itself re-examined the head; a
              // fallback performs no such re-examination, so it must not.
              // Checked on every evaluation, not only when the attestation was
              // minted: a resolved thread can be re-opened, and a late Codex
              // finding can arrive already-outdated, both without a new commit.
              //
              // Consumers may pass a function so the extra thread lookup only
              // happens after the cheap preconditions above have passed — a
              // repository with fallback disabled must not pay for it at all.
              const outdatedUnresolved =
                typeof settings.outdatedUnresolvedFinding === 'function'
                  ? await settings.outdatedUnresolvedFinding()
                  : settings.outdatedUnresolvedFinding;
              if (outdatedUnresolved) {
                return none('outdated_finding_needs_resolution');
              }

              const comments = settings.comments || [];
              const quotaNotices = (settings.quotaNotices || []);
              const realActivity = (settings.realActivity || []);
              // The episode is evaluated per candidate, because Route B is
              // bound to when the fallback review itself was attested.
              const episodeFor = (attestedAt) => evaluateQuotaEpisode(quotaNotices, {
                headObservedAt: settings.headObservedAt,
                realActivity,
                attestedAt,
                codexSignalOnHead: false,
              });
              const episode = episodeFor(Date.now());

              // Collect candidate attestations from trusted-identity comments
              // only, newest run first, bounded like the epoch markers are.
              const candidates = [];
              for (const comment of comments) {
                const login = String(comment?.user?.login || comment?.author?.login || '');
                if (login !== FALLBACK_ATTESTATION_AUTHOR) continue;
                // A comment body is mutable and editing does not move
                // created_at, so an edited marker can no longer be tied to the
                // run that wrote it. Treat any edit as tampering.
                if (comment?.updated_at && comment.updated_at !== comment.created_at) {
                  core.warning(
                    `PR #${prNumber}: ignoring an edited Claude fallback attestation comment.`,
                  );
                  continue;
                }
                for (const attestation of parseFallbackAttestations(comment?.body)) {
                  if (Number(attestation.pr) !== prNumber) continue;
                  candidates.push({
                    attestation,
                    runId: Number(attestation.run),
                    attempt: Number(attestation.attempt || 1),
                    commentAt: new Date(comment?.created_at || 0).getTime(),
                  });
                }
              }
              if (!candidates.length) return none('no_attestation');
              candidates.sort((a, b) => b.runId - a.runId);
              const bounded = candidates.slice(0, MAX_FALLBACK_ATTESTATION_CANDIDATES);

              let best = none('no_attestation');
              for (const candidate of bounded) {
                const evaluated = evaluateFallbackAttestation(candidate.attestation, headSha);
                if (!evaluated.accepted && !evaluated.blocking) {
                  if (best.reason === 'no_attestation') best = { ...evaluated, episodeReason: episode.reason };
                  continue;
                }
                // Authenticate the producing run before honouring the marker.
                let run = null;
                try {
                  if (!Number.isFinite(candidate.runId) || candidate.runId <= 0) throw new Error('bad run id');
                  // The caller injects a reader bound to a token that really
                  // holds `actions: read`. Merge Bot and the watchdog run their
                  // default client on AUTOMATION_PAT, which cannot be relied on
                  // for this read, so they pass their GITHUB_TOKEN reader.
                  if (typeof settings.fetchRunAttempt !== 'function') {
                    throw new Error('no authenticated run reader supplied');
                  }
                  run = await settings.fetchRunAttempt(candidate.runId, candidate.attempt);
                } catch (e) {
                  // Fail closed: an unverifiable attestation is not evidence.
                  core.warning(
                    `PR #${prNumber}: fallback attestation run ${candidate.runId} verification failed; ignoring it: ${e.message}`,
                  );
                  continue;
                }
                if (!attestationRunIsTrusted(
                  run, candidate.attempt, candidate.commentAt, settings.defaultBranch,
                )) {
                  core.warning(
                    `PR #${prNumber}: fallback attestation run ${candidate.runId} is not the canonical producer; ignoring it.`,
                  );
                  continue;
                }
                if (evaluated.blocking) {
                  return {
                    accepted: false, blocking: true,
                    severity: evaluated.severity || 'P1',
                    reason: 'unresolved_fallback_finding',
                    episodeReason: episode.reason,
                  };
                }
                const candidateEpisode = episodeFor(candidate.commentAt);
                if (!candidateEpisode.active) {
                  return {
                    accepted: false, blocking: false, severity: null,
                    reason: candidateEpisode.reason,
                    episodeReason: candidateEpisode.reason,
                  };
                }
                return {
                  accepted: true, blocking: false, severity: null,
                  reason: 'structured_fallback_clean',
                  episodeReason: candidateEpisode.reason,
                  // When this evidence was recorded. Consumers use it to avoid
                  // re-dispatching work that already ran after the attestation.
                  attestedAt: candidate.commentAt,
                };
              }
              return best;
            }
            // ===== END CANONICAL EXACT-HEAD REVIEW EVIDENCE ==================

            let anyBlocked = false;
            const results = [];

            // Publish the authoritative, rich 🟢/🔴/🟡 required check on the
            // exact PR head. CREATE-ONLY avoids GitHub's cross-run check-update
            // restriction; each evaluation creates a fresh completed run and
            // latest-per-name readers consume the newest verdict.
            let gatePublishFailed = false;
            async function publishGateCheck(headSha, conclusion, title, summary) {
              try {
                await github.rest.checks.create({
                  owner, repo, name: 'check-codex-status', head_sha: headSha,
                  status: 'completed', conclusion,
                  output: { title, summary },
                });
              } catch (e) {
                gatePublishFailed = true;
                core.error(`check-codex-status publish failed for ${String(headSha).slice(0, 7)}: ${e.message}`);
              }
            }

            for (const prNumber of prNumbers) {
              let headSha = context.payload.pull_request?.head?.sha || null;
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner, repo, pull_number: prNumber,
                });
                headSha = pr.head.sha;
                const head7 = headSha.substring(0, 7);
                if (!(await triggeringHeadEventIsCurrent(prNumber, headSha))) {
                  core.info(`PR #${prNumber}: stale queued head event does not match the latest live head epoch; evaluation skipped`);
                  results.push(`PR #${prNumber}: ⏭️ stale queued head event skipped`);
                  continue;
                }

                // Codex feedback across all three channels, fully paginated
                // (the default 30/page silently drops the first Codex review
                // on chatty PRs — the very place a P1 lives).
                const reviews = await github.paginate(github.rest.pulls.listReviews, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                });
                let comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber, per_page: 100,
                });
                try {
                  comments = await ensureHeadEpochMarker(prNumber, comments);
                } catch (e) {
                  core.warning(`PR #${prNumber}: trusted head marker publish failed; markerless signals stay fail-closed: ${e.message}`);
                }
                // Manual override — admin force-merge. Epoch reconciliation
                // deliberately happens first so A->B->A cannot reuse a signal
                // from the earlier A after the override is removed.
                if (pr.labels.some(l => l.name === 'codex-p1-acknowledged')) {
                  results.push(`PR #${prNumber}: ✅ override label present`);
                  await publishGateCheck(headSha, 'success', '🟢 Reviewed — clear',
                    `Override label \`codex-p1-acknowledged\` is set on ${head7} — gate forced green.`);
                  continue;
                }
                const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                });
                const reactions = await github.paginate(github.rest.reactions.listForIssue, {
                  owner, repo, issue_number: prNumber, per_page: 100,
                });
                let headObservedAt = null;
                try {
                  headObservedAt = await observedHeadTransition(prNumber, headSha, comments);
                } catch (e) {
                  core.warning(`PR #${prNumber}: exact-head transition lookup failed; unmarked review signals and sync grace stay pending: ${e.message}`);
                }

                // Inline review-thread state is authoritative for P1/P2
                // liveness. REST comment timestamps cannot tell whether a
                // finding is resolved or outdated, so fetch the GraphQL
                // reviewThreads connection (fully paginated).
                const reviewThreads = [];
                let threadCursor = null;
                do {
                  const threadData = await github.graphql(
                    `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $number) {
                          reviewThreads(first: 100, after: $cursor) {
                            pageInfo { hasNextPage endCursor }
                            nodes {
                              id
                              isResolved
                              isOutdated
                              path
                              line
                              startLine
                              comments(first: 100) {
                                nodes {
                                  body
                                  createdAt
                                  author { login }
                                }
                              }
                            }
                          }
                        }
                      }
                    }`,
                    { owner, repo, number: prNumber, cursor: threadCursor },
                  );
                  const connection =
                    threadData.repository.pullRequest.reviewThreads;
                  reviewThreads.push(...connection.nodes.map(t => ({
                    ...t,
                    comments: t.comments.nodes,
                  })));
                  threadCursor = connection.pageInfo.hasNextPage
                    ? connection.pageInfo.endCursor
                    : null;
                } while (threadCursor);

                // A trusted-actor quota/capacity notice proves no review
                // occurred. It must never become an affirmative head signal.
                const codexReviews = reviews.filter(r =>
                  isCodex(r.user) && !isCodexCapacityNotice(r.body) && !isCodexTaskResult(r.body));
                const codexComments = comments.filter(c =>
                  isCodex(c.user) && !isCodexCapacityNotice(c.body) && !isCodexTaskResult(c.body));
                const codexReviewComments = reviewComments.filter(c =>
                  isCodex(c.user) && !isCodexCapacityNotice(c.body) && !isCodexTaskResult(c.body));
                const codexReactions = reactions.filter(r => isCodex(r.user));
                // Total exact-bindable Codex signals of any date. Zero means
                // no review result engaged (the trusted-sync grace precondition).
                const codexSignalCount =
                  codexReviews.length + codexComments.length +
                  codexReviewComments.length + codexReactions.length;

                // Exact review.commit_id / original_commit_id / Codex's Reviewed
                // commit marker binds directly to the SHA. Unmarked comments,
                // reactions, and task summaries are never affirmative because
                // asynchronous old-head work can finish after a new push.
                const onHead = (item, dateField) =>
                  signalTargetsHead(item, headSha, headObservedAt, dateField);

                const allBodies = [
                  ...codexReviews.map(r => ({
                    body: r.body || '',
                    bodyForP1: stripSummarySections(r.body || ''),
                    date: r.submitted_at,
                    onHead: onHead(r, 'submitted_at'),
                  })),
                  ...codexComments.map(c => ({
                    body: c.body || '',
                    bodyForP1: stripSummarySections(c.body || ''),
                    date: c.created_at,
                    onHead: onHead(c, 'created_at'),
                  })),
                  ...codexReviewComments.map(c => ({
                    body: c.body || '',
                    bodyForP1: stripSummarySections(c.body || ''),
                    date: c.created_at,
                    onHead: onHead(c, 'created_at'),
                  })),
                ].sort((a, b) => new Date(a.date) - new Date(b.date));

                let codexReactionOnHead = false;
                const hasTrustedCleanReaction = codexReactions.some(
                  (reaction) => reaction.content === '+1',
                );
                if (hasTrustedCleanReaction) {
                  const reactionOnlyHead = await onlyObservedHead(
                    prNumber, headSha, comments,
                  );
                  codexReactionOnHead = codexReactions.some((reaction) =>
                    reactionTargetsOnlyObservedHead(
                      reaction, headObservedAt, reactionOnlyHead,
                    )
                  );
                }

                // Has Codex actually reviewed the CURRENT head? = any Codex
                // review result explicitly bound to the SHA. A reaction-only
                // clean result is allowed only when authenticated marker
                // history proves this PR has never had another observed head.
                // This does not stale an active review thread.
                const hasCodexSignalOnHead =
                  allBodies.some(item => item.onHead) || codexReactionOnHead;

                // Review bodies and top-level PR comments can carry trusted
                // P1/P2 findings without an inline review thread. They remain
                // active only when explicitly bound to this SHA or posted after
                // its observed head transition; a later clean signal cannot
                // erase them. A new head still requires a fresh review.
                const nonInlineFindings = [
                  ...codexReviews.map((review) => ({
                    body: review.body || '',
                    onHead: onHead(review, 'submitted_at'),
                    channel: 'review body',
                  })),
                  ...codexComments.map((comment) => ({
                    body: comment.body || '',
                    onHead: onHead(comment, 'created_at'),
                    channel: 'PR comment',
                  })),
                ].filter((item) => item.onHead && severity(item.body))
                  .map((item) => ({
                    severity: severity(item.body),
                    path: `(${item.channel})`,
                    line: null,
                    startLine: null,
                    threadId: '',
                  }));

                // CANONICAL CONTRACT: exact-head review evidence is normal
                // Codex evidence OR approved Claude fallback evidence when
                // Codex is provably unavailable. The inputs are built by the
                // shared collector so Gate, Merge Bot and the watchdog cannot
                // reach different verdicts from different evidence sets.
                const evidenceInputs = collectReviewEvidenceInputs({
                  reviews, comments, reviewComments, reactions,
                });
                // An outdated thread nobody resolved still holds a live Codex
                // finding; a fallback may not clear it.
                const outdatedUnresolvedFinding =
                  classifyThreads(reviewThreads).outdated.length > 0;
                const fallbackEvidence = await acceptedFallbackEvidence({
                  prNumber,
                  headSha,
                  headObservedAt,
                  comments,
                  quotaNotices: evidenceInputs.quotaNotices,
                  realActivity: evidenceInputs.realActivity,
                  defaultBranch: pr.base?.repo?.default_branch,
                  outdatedUnresolvedFinding,
                  codexSignalOnHead: hasCodexSignalOnHead,
                  // This evaluator's default client is GITHUB_TOKEN, which
                  // carries the declared `actions: read` permission.
                  fetchRunAttempt: (runId, attempt) => github.request(
                    'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}',
                    { owner, repo, run_id: runId, attempt_number: attempt },
                  ).then(({ data }) => data),
                });

                const gateDecision = decideCodexGate({
                  threads: reviewThreads,
                  nonInlineFindings,
                  currentHeadSignal: hasCodexSignalOnHead || fallbackEvidence.accepted,
                });
                const reviewAuthority = hasCodexSignalOnHead
                  ? 'codex'
                  : (gateDecision.status === 'clear' && fallbackEvidence.accepted)
                    ? FALLBACK_PROVIDER
                    : 'none';

                // A fallback that itself reports unresolved exact-head P1/P2 is
                // a finding, not evidence. Genuine Codex findings still take
                // precedence and are handled by the blocked branch below.
                if (gateDecision.status !== 'blocked' && fallbackEvidence.blocking) {
                  results.push(
                    `PR #${prNumber}: ❌ Claude fallback review reports unresolved ${fallbackEvidence.severity} on head ${head7}`
                  );
                  await publishGateCheck(
                    headSha,
                    'failure',
                    '🔴 Unresolved Claude fallback finding',
                    `The structured Claude Code fallback review for ${head7} declares unresolved ${fallbackEvidence.severity} work. Fix it and re-review the exact head.`,
                  );
                  anyBlocked = true;
                  continue;
                }

                // Active thread/non-inline finding state wins over a clean
                // signal or current-head thumbs-up.
                if (gateDecision.status === 'blocked') {
                  const locations = gateDecision.activeFindings
                    .slice(0, 5)
                    .map(f => `${f.severity} ${f.path}:${f.line || f.startLine || '?'}`)
                    .join(', ');
                  results.push(
                    `PR #${prNumber}: ❌ active trusted Codex P1/P2 finding(s): ${locations}`
                  );
                  await publishGateCheck(
                    headSha,
                    'failure',
                    '🔴 Active Codex P1/P2 finding',
                    `Resolve/update the active trusted finding(s) on ${head7}: ${locations}.`,
                  );
                  anyBlocked = true;
                  continue;
                }

                if (gateDecision.status === 'pending') {
                  // Preserve trusted-sync grace only for total Codex silence.
                  // A stale/outdated finding is evidence of engagement and
                  // therefore can never take this bypass.
                  const graceMs = SYNC_GRACE_MINUTES * 60 * 1000;
                  const headAgeMs = headObservedAt
                    ? Date.now() - headObservedAt.getTime()
                    : 0;
                  const silentTrustedSync =
                    isTrustedSync(pr) && codexSignalCount === 0 &&
                    gateDecision.reason === 'current_head_review_pending';
                  if (silentTrustedSync && headAgeMs > graceMs) {
                    results.push(
                      `PR #${prNumber}: ✅ trusted sync — no Codex signal within ${SYNC_GRACE_MINUTES}m grace on head ${head7}; auto-cleared`
                    );
                    await publishGateCheck(
                      headSha,
                      'success',
                      '🟢 Trusted sync — no Codex findings within grace window',
                      `Validated byte-copy sync; Codex posted no signal within ${SYNC_GRACE_MINUTES} min of ${head7}.`,
                    );
                    continue;
                  }
                  const reasonText =
                    gateDecision.reason === 'outdated_finding_needs_current_head_signal'
                      ? 'an outdated finding awaits a clean current-head Codex signal'
                      : `Codex has not reviewed head ${head7}`;
                  // Say plainly why a Claude fallback did not substitute, so an
                  // operator can see which canonical requirement is missing.
                  const fallbackNote =
                    fallbackEvidence.reason === 'fallback_policy_disabled'
                      ? ' Claude fallback review evidence is not enabled for this repository.'
                      : fallbackEvidence.reason === 'no_attestation'
                        ? ' No structured Claude fallback attestation is present for this head.'
                        : ` No accepted Claude fallback evidence (${fallbackEvidence.reason}).`;
                  results.push(`PR #${prNumber}: ⏳ pending — ${reasonText}`);
                  await publishGateCheck(
                    headSha,
                    'failure',
                    // Exact string: claude-fallback-watchdog.yml matches this
                    // title to find stuck PRs. Do not reword it without
                    // changing PENDING_TITLE there in the same release.
                    '🟡 Waiting for Codex review',
                    `${reasonText}. Resolved threads clear directly; outdated threads require a current-head clean signal.${fallbackNote}`,
                  );
                  anyBlocked = true;
                  continue;
                }

                // Provenance must be truthful: never report "Codex reviewed"
                // when Claude Code actually performed the review, and never let
                // a reason string that reads like a Codex signal describe one.
                const provenance = reviewEvidenceProvenance(reviewAuthority);
                const evidenceReason = reviewAuthority === FALLBACK_PROVIDER
                  ? (gateDecision.reason === 'outdated_findings_and_current_head_signal'
                    ? 'outdated_findings_and_claude_fallback_attestation'
                    : 'claude_fallback_attestation_no_active_findings')
                  : gateDecision.reason;
                results.push(
                  `PR #${prNumber}: ✅ ${evidenceReason} on head ${head7} — ${provenance}`
                );
                await publishGateCheck(
                  headSha,
                  'success',
                  reviewAuthority === FALLBACK_PROVIDER
                    ? '🟢 Reviewed — clear (Claude Code fallback)'
                    : '🟢 Reviewed — clear',
                  `${provenance}. No unresolved non-outdated trusted Codex P1/P2 thread blocks ${head7} (${evidenceReason}).`,
                );
              } catch (err) {
                // fail-soft: a TECHNICAL failure (API hiccup, rate limit, etc.)
                // must NEVER wedge a PR red forever. We did not detect a P1
                // here, so do not block — log loudly instead. A real P1 is only
                // ever detected by the pattern above, which blocks; this branch
                // only fires on genuine exceptions.
                results.push(
                  `PR #${prNumber}: ⚠️ gate errored technically — not blocking (fail-soft): ${err.message}`
                );
                core.warning(`Codex Gate technical error on PR #${prNumber}: ${err.stack || err.message}`);
                if (headSha) {
                  await publishGateCheck(
                    headSha,
                    'success',
                    '🟢 Technical fail-soft',
                    `The trusted evaluator hit a technical API error for PR #${prNumber}; no active P1/P2 was established.`,
                  );
                } else {
                  gatePublishFailed = true;
                }
              }
            }

            core.summary.addHeading('Codex Gate Results').addList(results).write();
            results.forEach(r => core.info(r));

            // The evaluator job is diagnostic; the explicit PR-head check is
            // authoritative. Fail the evaluator when a policy block exists or
            // the required head check could not be published, so failures remain
            // visible even though this job itself is attached to the trusted ref.
            // A scheduled run evaluates every open PR. Keep each explicit
            // head check red/green independently, but do not fail the aggregate
            // merely because one unrelated PR is blocked: a successful sweep
            // must wake Merge Bot for another PR that just cleared. A check
            // publication failure remains loud, and event-driven single-PR
            // policy blocks remain failed as before.
            if ((anyBlocked && context.eventName !== 'schedule') || gatePublishFailed) {
              core.setFailed(
                'Blocked by Codex Gate: an active P1 or P2 is unresolved, or Codex has not reviewed the current head yet.\n' +
                'Resolve by one of:\n' +
                '  1. Wait — Codex reviews automatically on every push; the gate re-checks on Codex activity and the trusted scheduled sweep (≤15m), and goes green once Codex posts any signal with no active P1/P2.\n' +
                '  2. Resolve the review thread, or update its relevant diff and wait for GitHub to mark it outdated plus a clean current-head Codex signal.\n' +
                '  3. Add label "codex-p1-acknowledged" to override.'
              );
            }
