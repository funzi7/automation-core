name: Codex Gate

# Blocking status check `check-codex-status`.
#
# Invariant: an unresolved, non-outdated trusted Codex P1/P2 inline review
# thread blocks regardless of unrelated later commits or current-head thumbs-up.
# A finding clears only when its thread is resolved, or GitHub marks it outdated
# and Codex supplies a current-head signal with no active replacement finding,
# or the explicit `codex-p1-acknowledged` administrator label is present.
# Current-head review freshness is bound to the review's exact commit marker or
# to a signal after a trusted bot-recorded head transition; Git commit timestamps
# are never used. Thread state comes from GitHub GraphQL.
# The authoritative decision implementation stays inline in this trusted
# default-branch workflow. PR-controlled workflow, checkout and require paths
# are forbidden; review events are rechecked through a default-branch
# workflow_run relay. A PAT-independent scheduled sweep covers thread-state
# changes and reaction events that have no supported Actions trigger.
# Trusted actor allowlisting, Summary/Testing quote stripping, reaction-based
# clean signals, trusted-sync grace and intentional technical fail-soft remain.
#
on:
  # SECURITY: pull_request/review/review_comment workflows execute from the
  # untrusted PR merge ref. pull_request_target executes this workflow from the
  # base default branch. No step checks out or executes PR-controlled code.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # issue_comment uses the default-branch ref and is safe here; untrusted body
  # text is never interpolated into executable script.
  issue_comment:
    types: [created, edited, deleted]
  # A pull_request_review workflow would execute from the untrusted PR merge
  # ref. Codex Auto-Fix already receives that event (including clean reviews,
  # whose job is skipped); its completed run relays here, where GitHub loads
  # this evaluator from the default branch. This path uses GITHUB_TOKEN only,
  # so clean reviews are rechecked even when AUTOMATION_PAT is unavailable.
  workflow_run:
    workflows: ['Codex Auto-Fix']
    types: [completed]
  # GitHub Actions has no pull_request_review_thread trigger. Sweep open PRs
  # from this trusted default-branch workflow so resolved/reopened thread state
  # is reflected on the exact head even when AUTOMATION_PAT is unavailable.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check (used by the watchdog sweep + manual re-check)'
        required: false
        type: string

# Keep one evaluator run alive to completion; event bursts may queue one newer
# review-thread-aware evaluation, but never cancel a half-published PR-head
# verdict. Each run creates a fresh completed `check-codex-status` check on the
# exact PR head; no cross-run check update is attempted.
concurrency:
  # The scheduled sweep can cover several PRs in one run, so serialize every
  # evaluator in the repository. This prevents event-driven and scheduled
  # snapshots from publishing exact-head verdicts in stale completion order.
  group: codex-gate-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  # The trusted default-branch evaluator records each new PR-head epoch in an
  # authenticated github-actions[bot] marker comment.
  issues: write
  # Markerless legacy PRs bootstrap from the current contiguous pull_request-run
  # SHA epoch as a server-observed transition floor.
  actions: read
  # fix #11: publish the explicit `check-codex-status` check-run with output text.
  checks: write

jobs:
  # pull_request_target and default-branch dispatch runs attach their native job
  # check to the trusted workflow ref, not necessarily to the PR head. Therefore
  # the authoritative required check is the create-only `check-codex-status`
  # check published explicitly against pr.head.sha below. The evaluator job has
  # a distinct name so branch protection and merge automation cannot confuse it
  # with the PR-head verdict.
  codex-gate:
    name: codex-gate-evaluator
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number(s) to check
        id: prs
        uses: actions/github-script@v8
        with:
          script: |
            // pull_request_target → the PR being opened/synced, with this
            //   workflow loaded from the trusted base/default branch
            // issue_comment → context.payload.issue (PRs are issues for
            //   the comments API; workflow ref is the default branch)
            // workflow_run → trusted default-branch relay for Codex review
            //   activity; workflow_dispatch → no PR payload at all,
            //   the PR number comes through as an input; parse it back
            //   into a JS number so downstream filters compare correctly.
            let prNumbers = [];

            if (context.payload.pull_request) {
              prNumbers = [context.payload.pull_request.number];
            } else if (context.payload.issue?.pull_request) {
              prNumbers = [context.payload.issue.number];
            } else if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run || {};
              prNumbers = [...new Set(
                (run.pull_requests || [])
                  .map((pull) => Number(pull.number))
                  .filter(Number.isFinite),
              )];
              // GitHub can omit workflow_run.pull_requests for some event
              // shapes. Resolve against the run SHA without trusting a branch
              // name supplied by PR code.
              if (!prNumbers.length && run.head_sha) {
                const associated = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  { owner: context.repo.owner, repo: context.repo.repo, commit_sha: run.head_sha, per_page: 100 },
                );
                prNumbers = [...new Set(
                  associated
                    .filter((pull) => pull.state === 'open' && pull.base?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`)
                    .map((pull) => Number(pull.number))
                    .filter(Number.isFinite),
                  )];
              }
            } else if (context.eventName === 'schedule') {
              const open = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', per_page: 100,
              });
              prNumbers = open.map((pull) => pull.number);
            } else if (
              context.eventName === 'workflow_dispatch' &&
              context.payload.inputs?.pr_number
            ) {
              prNumbers = [parseInt(context.payload.inputs.pr_number, 10)];
            }

            core.setOutput('numbers', JSON.stringify(prNumbers));

      - name: Evaluate Codex P1 status for each PR
        if: steps.prs.outputs.numbers != '[]'
        uses: actions/github-script@v8
        env:
          PR_NUMBERS_JSON: ${{ steps.prs.outputs.numbers }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumbers = JSON.parse(process.env.PR_NUMBERS_JSON || '[]');

            // fix #21: trusted-sync grace-green. A sync PR is a byte-copy of an
            // upstream automation-core main that already passed our full validation;
            // Codex engages on syncs inconsistently and SILENCE is not a finding, so
            // a trusted sync with zero Codex signals auto-clears after a grace window.
            const SYNC_GRACE_MINUTES = 30;
            // Trusted-sync predicate — must match merge-bot.yml / codex-gate.yml — keep in sync.
            const SYNC_TITLE_PREFIX = 'chore(automation): sync from automation-core';
            const SYNC_BRANCH = 'chore/sync-automation-core';   // branch the sync workflow opens
            const OWNER_LOGIN = 'funzi7';
            const isTrustedSync = (pr) => {
              const titleIsSync = (pr.title || '').startsWith(SYNC_TITLE_PREFIX);
              const sameRepo = !!(pr.head && pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`);
              return titleIsSync && (
                (pr.user && pr.user.login === OWNER_LOGIN) ||
                ((pr.head && pr.head.ref === SYNC_BRANCH) && sameRepo)
              );
            };

            // Strict Codex actor allowlist — must match claude-fallback-watchdog.yml — keep in sync.
            // Exact GitHub App identities: GraphQL reviewThreads omit
            // the REST-style [bot] suffix.
            const TRUSTED_CODEX_LOGINS = new Set([
              'chatgpt-codex-connector',
              'chatgpt-codex-connector[bot]',
            ]);
            const isCodex = (user) => !!user?.login && TRUSTED_CODEX_LOGINS.has(user.login);

            // SECURITY: authoritative policy stays inline in this workflow.
            // Never checkout/require executable gate code from the PR merge
            // ref. tools/codex_gate_logic.js mirrors this pure logic for CI.
            const P1_PATTERN = /(?:P1-orange|(?:^|\n)[\s>*\-_#`]*(?:\*\*\s*P1\s*\*\*|\[P1\]|P1:))/i;
            const P2_PATTERN = /(?:P2-yellow|(?:^|\n)[\s>*\-_#`]*(?:\*\*\s*P2\s*\*\*|\[P2\]|P2:))/i;

            function stripSummarySections(body) {
              if (!body) return '';
              return String(body)
                .replace(/(?:^|\n)#{2,3}\s+Summary[\s\S]*?(?=\n#{2,3}\s|\n---|$)/gi, '')
                .replace(/(?:^|\n)#{2,3}\s+Testing[\s\S]*?(?=\n#{2,3}\s|\n---|$)/gi, '');
            }

            function severity(body) {
              const semantic = stripSummarySections(body);
              if (P1_PATTERN.test(semantic)) return 'P1';
              if (P2_PATTERN.test(semantic)) return 'P2';
              return null;
            }

            const REVIEWED_COMMIT_PATTERN = /(?:^|\n)\*\*Reviewed commit:\*\*\s*`([a-f0-9]{10,40})`(?:\s|$)/i;
            const HEAD_EPOCH_MARKER_PATTERN = /<!--\s*codex-head-epoch:v2\s+run=(\d+)\s+attempt=(\d+)\s*-->/i;
            function signalTargetsHead(item, headSha, headObservedAt, dateField = 'created_at') {
              const exactHead = String(headSha || '').toLowerCase();
              if (!/^[a-f0-9]{40}$/.test(exactHead)) return false;
              const originalCommit = String(item?.original_commit_id || '').toLowerCase();
              if (originalCommit) return originalCommit === exactHead;
              const commit = String(item?.commit_id || '').toLowerCase();
              if (commit) return commit === exactHead;
              const marker = String(item?.body || '').match(REVIEWED_COMMIT_PATTERN)?.[1]?.toLowerCase();
              if (marker) return exactHead.startsWith(marker);
              const signalAt = new Date(item?.[dateField] || 0).getTime();
              const observedAt = new Date(headObservedAt || 0).getTime();
              return Number.isFinite(signalAt) && Number.isFinite(observedAt) &&
                observedAt > 0 && signalAt > observedAt;
            }

            let prWorkflowRunsPromise = null;
            function allPrWorkflowRuns() {
              if (!prWorkflowRunsPromise) {
                prWorkflowRunsPromise = github.paginate(
                  github.rest.actions.listWorkflowRunsForRepo,
                  { owner, repo, event: 'pull_request', per_page: 100 },
                );
              }
              return prWorkflowRunsPromise;
            }

            const epochRunCache = new Map();
            async function trustedHeadMarkers(comments, prNumber, headSha) {
              const exactHead = String(headSha || '').toLowerCase();
              const refs = [];
              for (const comment of comments || []) {
                if ((comment.user?.login || '') !== 'github-actions[bot]') continue;
                const match = String(comment.body || '').match(HEAD_EPOCH_MARKER_PATTERN);
                if (match) refs.push({
                  runId: Number(match[1]), attempt: Number(match[2]),
                  commentAt: new Date(comment.created_at || 0).getTime(),
                  commentId: Number(comment.id || 0),
                });
              }
              refs.sort((a, b) => b.commentAt - a.commentAt || b.commentId - a.commentId);
              const markers = [];
              const accepted = new Set();
              for (const { runId, attempt, commentAt } of refs) {
                const key = `${runId}/${attempt}`;
                if (accepted.has(key)) continue;
                if (!epochRunCache.has(key)) {
                  epochRunCache.set(key, github.request(
                    'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}',
                    { owner, repo, run_id: runId, attempt_number: attempt },
                  ).then(({ data }) => data));
                }
                try {
                  const run = await epochRunCache.get(key);
                  const belongsToPr = (run.pull_requests || [])
                    .some((pull) => Number(pull.number) === Number(prNumber));
                  const startedAt = new Date(run.run_started_at || run.created_at || 0).getTime();
                  const finishedAt = new Date(run.updated_at || 0).getTime();
                  const commentInsideRun = Number.isFinite(commentAt) &&
                    commentAt >= startedAt - 5000 && (
                      run.status !== 'completed' || commentAt <= finishedAt + 5000
                    );
                  if (
                    run.path !== '.github/workflows/codex-gate.yml' ||
                    run.event !== 'pull_request_target' ||
                    Number(run.run_attempt) !== attempt || !belongsToPr || !commentInsideRun
                  ) continue;
                  accepted.add(key);
                  const observedAt = new Date(run.created_at || 0).getTime();
                  // Actions' run API preserves the triggering PR SHA here;
                  // unlike pull_requests[].head.sha, it does not track the live PR.
                  const head = String(run.head_sha || '').toLowerCase();
                  if (/^[a-f0-9]{40}$/.test(head) && Number.isFinite(observedAt) && observedAt > 0) {
                    markers.push({ head, observedAt, id: Number(run.id || runId) });
                    if (head !== exactHead) break;
                  }
                } catch (e) {
                  core.warning(`PR #${prNumber}: epoch run ${runId} verification failed: ${e.message}`);
                }
              }
              return markers;
            }

            function currentHeadEpochFromTimeline(timeline, headSha) {
              return currentHeadEpochEvidenceFromTimeline(timeline, headSha).epoch;
            }

            function currentHeadEpochEvidenceFromTimeline(timeline, headSha) {
              const exactHead = String(headSha || '').toLowerCase();
              if (!timeline.length || timeline[0].head !== exactHead) {
                return { epoch: null, hasBoundary: false };
              }
              const epoch = [];
              for (const item of timeline) {
                if (item.head !== exactHead) {
                  return {
                    epoch: epoch.length ? new Date(Math.min(...epoch)) : null,
                    hasBoundary: true,
                  };
                }
                epoch.push(item.observedAt);
              }
              return {
                epoch: epoch.length ? new Date(Math.min(...epoch)) : null,
                hasBoundary: false,
              };
            }

            function prRunTimeline(runs, prNumber) {
              return (runs || [])
                .filter((run) =>
                  (run.pull_requests || []).some((candidate) => candidate.number === prNumber))
                .map((run) => ({
                  head: String(run.head_sha || '').toLowerCase(),
                  observedAt: new Date(run.created_at || 0).getTime(),
                }))
                .filter((run) => /^[a-f0-9]{40}$/.test(run.head) && Number.isFinite(run.observedAt) && run.observedAt > 0)
                .sort((a, b) => a.observedAt - b.observedAt);
            }

            function currentHeadEpochEvidenceFromRuns(runs, prNumber, headSha) {
              const timeline = prRunTimeline(runs, prNumber).reverse();
              return currentHeadEpochEvidenceFromTimeline(timeline, headSha);
            }

            async function ensureHeadEpochMarker(prNumber, comments) {
              if (
                context.eventName !== 'pull_request_target' ||
                Number(context.payload.pull_request?.number) !== Number(prNumber) ||
                !new Set(['opened', 'synchronize', 'reopened']).has(context.payload.action)
              ) return comments;
              const runId = Number(context.runId);
              const attempt = Number(process.env.GITHUB_RUN_ATTEMPT || 1);
              const alreadyRecorded = (comments || []).some((comment) => {
                if ((comment.user?.login || '') !== 'github-actions[bot]') return false;
                const match = String(comment.body || '').match(HEAD_EPOCH_MARKER_PATTERN);
                return match && Number(match[1]) === runId && Number(match[2]) === attempt;
              });
              if (alreadyRecorded) return comments;
              const { data: marker } = await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `<!-- codex-head-epoch:v2 run=${runId} attempt=${attempt} -->`,
              });
              core.info(`PR #${prNumber}: indexed trusted head epoch run ${runId}/${attempt}`);
              return [...comments, marker];
            }

            async function observedHeadTransition(prNumber, headSha, comments = []) {
              const [markers, runs] = await Promise.all([
                trustedHeadMarkers(comments, prNumber, headSha),
                allPrWorkflowRuns(),
              ]);
              const markerEpoch = currentHeadEpochFromTimeline(markers, headSha);
              const runEvidence = currentHeadEpochEvidenceFromRuns(runs, prNumber, headSha);
              const runEpoch = runEvidence.epoch;
              // Authenticated markers retain the complete contiguous epoch. The
              // bounded run list may advance it only when it proves an
              // intervening different head that a failed marker write missed.
              if (markerEpoch && runEpoch && runEvidence.hasBoundary) {
                return new Date(Math.max(markerEpoch.getTime(), runEpoch.getTime()));
              }
              return markerEpoch || runEpoch;
            }

            function authorLogin(comment) {
              return String(
                comment?.author?.login ||
                comment?.user?.login ||
                comment?.authorLogin ||
                ''
              );
            }

            function findingFromThread(thread) {
              for (const comment of thread?.comments || []) {
                if (!TRUSTED_CODEX_LOGINS.has(authorLogin(comment))) continue;
                const level = severity(comment?.body || '');
                if (!level) continue;
                return {
                  severity: level,
                  path: String(thread?.path || ''),
                  line: Number.isInteger(thread?.line) ? thread.line : null,
                  startLine: Number.isInteger(thread?.startLine)
                    ? thread.startLine
                    : null,
                  threadId: String(thread?.id || ''),
                };
              }
              return null;
            }

            function classifyThreads(threads) {
              const active = [];
              const outdated = [];
              const resolved = [];
              for (const thread of threads || []) {
                const finding = findingFromThread(thread);
                if (!finding) continue;
                if (thread?.isResolved === true) resolved.push(finding);
                else if (thread?.isOutdated === true) outdated.push(finding);
                else active.push(finding);
              }
              return { active, outdated, resolved };
            }

            function decideCodexGate({
              threads = [],
              nonInlineFindings = [],
              currentHeadSignal = false,
              override = false,
              technicalError = false,
            } = {}) {
              if (override) {
                return {
                  status: 'clear',
                  reason: 'administrator_override',
                  activeFindings: [],
                };
              }
              if (technicalError) {
                return {
                  status: 'clear',
                  reason: 'technical_fail_soft',
                  activeFindings: [],
                };
              }
              if (nonInlineFindings.length) {
                return {
                  status: 'blocked',
                  reason: 'active_current_head_non_inline_finding',
                  activeFindings: nonInlineFindings,
                };
              }
              const classified = classifyThreads(threads);
              if (classified.active.length) {
                return {
                  status: 'blocked',
                  reason: 'active_unresolved_review_thread',
                  activeFindings: classified.active,
                  outdatedFindings: classified.outdated,
                };
              }
              if (classified.outdated.length && !currentHeadSignal) {
                return {
                  status: 'pending',
                  reason: 'outdated_finding_needs_current_head_signal',
                  activeFindings: [],
                  outdatedFindings: classified.outdated,
                };
              }
              if (currentHeadSignal) {
                return {
                  status: 'clear',
                  reason: classified.outdated.length
                    ? 'outdated_findings_and_current_head_signal'
                    : 'current_head_signal_no_active_findings',
                  activeFindings: [],
                  outdatedFindings: classified.outdated,
                };
              }
              // Resolution removes a finding; it is not permanent review
              // approval for unrelated commits pushed afterward.
              return {
                status: 'pending',
                reason: 'current_head_review_pending',
                activeFindings: [],
              };
            }

            let anyBlocked = false;
            const results = [];

            // Publish the authoritative, rich 🟢/🔴/🟡 required check on the
            // exact PR head. CREATE-ONLY avoids GitHub's cross-run check-update
            // restriction; each evaluation creates a fresh completed run and
            // latest-per-name readers consume the newest verdict.
            let gatePublishFailed = false;
            async function publishGateCheck(headSha, conclusion, title, summary) {
              try {
                await github.rest.checks.create({
                  owner, repo, name: 'check-codex-status', head_sha: headSha,
                  status: 'completed', conclusion,
                  output: { title, summary },
                });
              } catch (e) {
                gatePublishFailed = true;
                core.error(`check-codex-status publish failed for ${String(headSha).slice(0, 7)}: ${e.message}`);
              }
            }

            for (const prNumber of prNumbers) {
              let headSha = context.payload.pull_request?.head?.sha || null;
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner, repo, pull_number: prNumber,
                });
                headSha = pr.head.sha;
                const head7 = headSha.substring(0, 7);

                // Codex feedback across all three channels, fully paginated
                // (the default 30/page silently drops the first Codex review
                // on chatty PRs — the very place a P1 lives).
                const reviews = await github.paginate(github.rest.pulls.listReviews, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                });
                let comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: prNumber, per_page: 100,
                });
                try {
                  comments = await ensureHeadEpochMarker(prNumber, comments);
                } catch (e) {
                  core.warning(`PR #${prNumber}: trusted head marker publish failed; markerless signals stay fail-closed: ${e.message}`);
                }
                // Manual override — admin force-merge. Epoch reconciliation
                // deliberately happens first so A->B->A cannot reuse a signal
                // from the earlier A after the override is removed.
                if (pr.labels.some(l => l.name === 'codex-p1-acknowledged')) {
                  results.push(`PR #${prNumber}: ✅ override label present`);
                  await publishGateCheck(headSha, 'success', '🟢 Reviewed — clear',
                    `Override label \`codex-p1-acknowledged\` is set on ${head7} — gate forced green.`);
                  continue;
                }
                const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                });
                // PR-level reactions — Codex leaves a 👍 here when it has no
                // issues, sometimes WITHOUT any review body. That 👍 is a valid
                // "reviewed, nothing to fix" signal, so it counts. The 👍 fires
                // no event, so the watchdog sweep (fix #18) is what re-dispatches
                // the gate to catch it on the head (fix #25 removed the in-run poll).
                const reactions = await github.paginate(github.rest.reactions.listForIssue, {
                  owner, repo, issue_number: prNumber, per_page: 100,
                });
                let headObservedAt = null;
                try {
                  headObservedAt = await observedHeadTransition(prNumber, headSha, comments);
                } catch (e) {
                  core.warning(`PR #${prNumber}: exact-head transition lookup failed; unmarked review signals and sync grace stay pending: ${e.message}`);
                }

                // Inline review-thread state is authoritative for P1/P2
                // liveness. REST comment timestamps cannot tell whether a
                // finding is resolved or outdated, so fetch the GraphQL
                // reviewThreads connection (fully paginated).
                const reviewThreads = [];
                let threadCursor = null;
                do {
                  const threadData = await github.graphql(
                    `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $number) {
                          reviewThreads(first: 100, after: $cursor) {
                            pageInfo { hasNextPage endCursor }
                            nodes {
                              id
                              isResolved
                              isOutdated
                              path
                              line
                              startLine
                              comments(first: 100) {
                                nodes {
                                  body
                                  createdAt
                                  author { login }
                                }
                              }
                            }
                          }
                        }
                      }
                    }`,
                    { owner, repo, number: prNumber, cursor: threadCursor },
                  );
                  const connection =
                    threadData.repository.pullRequest.reviewThreads;
                  reviewThreads.push(...connection.nodes.map(t => ({
                    ...t,
                    comments: t.comments.nodes,
                  })));
                  threadCursor = connection.pageInfo.hasNextPage
                    ? connection.pageInfo.endCursor
                    : null;
                } while (threadCursor);

                const codexReviews = reviews.filter(r => isCodex(r.user));
                const codexComments = comments.filter(c => isCodex(c.user));
                const codexReviewComments = reviewComments.filter(c => isCodex(c.user));
                // fix #21: total Codex signals of ANY kind (any date) — reviews,
                // review comments, issue comments, and issue-level reactions. Zero
                // means Codex never engaged at all (the trusted-sync grace precondition).
                const codexReactions = reactions.filter(r => isCodex(r.user));
                const codexSignalCount =
                  codexReviews.length + codexComments.length +
                  codexReviewComments.length + codexReactions.length;

                // Exact review.commit_id / Codex's Reviewed commit marker binds
                // directly to the SHA. Other surfaces (including reactions and
                // repointed inline comments) count only after GitHub Actions
                // observed this SHA as this PR's head. Git commit dates are not
                // push/head-transition timestamps and are never used here.
                const onHead = (item, dateField) =>
                  signalTargetsHead(item, headSha, headObservedAt, dateField);

                const allBodies = [
                  ...codexReviews.map(r => ({
                    body: r.body || '',
                    bodyForP1: stripSummarySections(r.body || ''),
                    date: r.submitted_at,
                    onHead: onHead(r, 'submitted_at'),
                  })),
                  ...codexComments.map(c => ({
                    body: c.body || '',
                    bodyForP1: stripSummarySections(c.body || ''),
                    date: c.created_at,
                    onHead: onHead(c, 'created_at'),
                  })),
                  ...codexReviewComments.map(c => ({
                    body: c.body || '',
                    bodyForP1: stripSummarySections(c.body || ''),
                    date: c.created_at,
                    onHead: onHead(c, 'created_at'),
                  })),
                ].sort((a, b) => new Date(a.date) - new Date(b.date));

                // An unmarked 👍 counts only after the server-observed head
                // transition. The watchdog sweep catches this no-event signal.
                const codexThumbsUpOnHead = reactions.some(
                  r => isCodex(r.user) && r.content === '+1' && onHead(r, 'created_at')
                );

                // Has Codex actually reviewed the CURRENT head? = any Codex
                // signal explicitly bound to the SHA or observed after its
                // head transition. This does not stale an active review thread.
                const hasCodexSignalOnHead =
                  allBodies.some(item => item.onHead) || codexThumbsUpOnHead;

                // Review bodies and top-level PR comments can carry trusted
                // P1/P2 findings without an inline review thread. They remain
                // active only when explicitly bound to this SHA or posted after
                // its observed head transition; a later clean signal cannot
                // erase them. A new head still requires a fresh review.
                const nonInlineFindings = [
                  ...codexReviews.map((review) => ({
                    body: review.body || '',
                    onHead: onHead(review, 'submitted_at'),
                    channel: 'review body',
                  })),
                  ...codexComments.map((comment) => ({
                    body: comment.body || '',
                    onHead: onHead(comment, 'created_at'),
                    channel: 'PR comment',
                  })),
                ].filter((item) => item.onHead && severity(item.body))
                  .map((item) => ({
                    severity: severity(item.body),
                    path: `(${item.channel})`,
                    line: null,
                    startLine: null,
                    threadId: '',
                  }));

                const gateDecision = decideCodexGate({
                  threads: reviewThreads,
                  nonInlineFindings,
                  currentHeadSignal: hasCodexSignalOnHead,
                });

                // Active thread/non-inline finding state wins over a clean
                // signal or current-head thumbs-up.
                if (gateDecision.status === 'blocked') {
                  const locations = gateDecision.activeFindings
                    .slice(0, 5)
                    .map(f => `${f.severity} ${f.path}:${f.line || f.startLine || '?'}`)
                    .join(', ');
                  results.push(
                    `PR #${prNumber}: ❌ active trusted Codex P1/P2 finding(s): ${locations}`
                  );
                  await publishGateCheck(
                    headSha,
                    'failure',
                    '🔴 Active Codex P1/P2 finding',
                    `Resolve/update the active trusted finding(s) on ${head7}: ${locations}.`,
                  );
                  anyBlocked = true;
                  continue;
                }

                if (gateDecision.status === 'pending') {
                  // Preserve trusted-sync grace only for total Codex silence.
                  // A stale/outdated finding is evidence of engagement and
                  // therefore can never take this bypass.
                  const graceMs = SYNC_GRACE_MINUTES * 60 * 1000;
                  const headAgeMs = headObservedAt
                    ? Date.now() - headObservedAt.getTime()
                    : 0;
                  const silentTrustedSync =
                    isTrustedSync(pr) && codexSignalCount === 0 &&
                    gateDecision.reason === 'current_head_review_pending';
                  if (silentTrustedSync && headAgeMs > graceMs) {
                    results.push(
                      `PR #${prNumber}: ✅ trusted sync — no Codex signal within ${SYNC_GRACE_MINUTES}m grace on head ${head7}; auto-cleared`
                    );
                    await publishGateCheck(
                      headSha,
                      'success',
                      '🟢 Trusted sync — no Codex findings within grace window',
                      `Validated byte-copy sync; Codex posted no signal within ${SYNC_GRACE_MINUTES} min of ${head7}.`,
                    );
                    continue;
                  }
                  const reasonText =
                    gateDecision.reason === 'outdated_finding_needs_current_head_signal'
                      ? 'an outdated finding awaits a clean current-head Codex signal'
                      : `Codex has not reviewed head ${head7}`;
                  results.push(`PR #${prNumber}: ⏳ pending — ${reasonText}`);
                  await publishGateCheck(
                    headSha,
                    'failure',
                    '🟡 Waiting for Codex review',
                    `${reasonText}. Resolved threads clear directly; outdated threads require a current-head clean signal.`,
                  );
                  anyBlocked = true;
                  continue;
                }

                results.push(
                  `PR #${prNumber}: ✅ ${gateDecision.reason} on head ${head7}`
                );
                await publishGateCheck(
                  headSha,
                  'success',
                  '🟢 Reviewed — clear',
                  `No unresolved non-outdated trusted Codex P1/P2 thread blocks ${head7} (${gateDecision.reason}).`,
                );
              } catch (err) {
                // fail-soft: a TECHNICAL failure (API hiccup, rate limit, etc.)
                // must NEVER wedge a PR red forever. We did not detect a P1
                // here, so do not block — log loudly instead. A real P1 is only
                // ever detected by the pattern above, which blocks; this branch
                // only fires on genuine exceptions.
                results.push(
                  `PR #${prNumber}: ⚠️ gate errored technically — not blocking (fail-soft): ${err.message}`
                );
                core.warning(`Codex Gate technical error on PR #${prNumber}: ${err.stack || err.message}`);
                if (headSha) {
                  await publishGateCheck(
                    headSha,
                    'success',
                    '🟢 Technical fail-soft',
                    `The trusted evaluator hit a technical API error for PR #${prNumber}; no active P1/P2 was established.`,
                  );
                } else {
                  gatePublishFailed = true;
                }
              }
            }

            core.summary.addHeading('Codex Gate Results').addList(results).write();
            results.forEach(r => core.info(r));

            // The evaluator job is diagnostic; the explicit PR-head check is
            // authoritative. Fail the evaluator when a policy block exists or
            // the required head check could not be published, so failures remain
            // visible even though this job itself is attached to the trusted ref.
            // A scheduled run evaluates every open PR. Keep each explicit
            // head check red/green independently, but do not fail the aggregate
            // merely because one unrelated PR is blocked: a successful sweep
            // must wake Merge Bot for another PR that just cleared. A check
            // publication failure remains loud, and event-driven single-PR
            // policy blocks remain failed as before.
            if ((anyBlocked && context.eventName !== 'schedule') || gatePublishFailed) {
              core.setFailed(
                'Blocked by Codex Gate: an active P1 or P2 is unresolved, or Codex has not reviewed the current head yet.\n' +
                'Resolve by one of:\n' +
                '  1. Wait — Codex reviews automatically on every push; the gate re-checks on Codex activity and the trusted scheduled sweep (≤15m), and goes green once Codex posts any signal with no active P1/P2.\n' +
                '  2. Resolve the review thread, or update its relevant diff and wait for GitHub to mark it outdated plus a clean current-head Codex signal.\n' +
                '  3. Add label "codex-p1-acknowledged" to override.'
              );
            }
